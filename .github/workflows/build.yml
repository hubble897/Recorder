name: Build Gesture Recorder Overlay APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. CHECKOUT
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. JAVA 17
      # --------------------------------------------------

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # --------------------------------------------------
      # 3. ANDROID SDK
      # --------------------------------------------------

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # --------------------------------------------------
      # 4. CREATE PROJECT DIRECTORIES
      # --------------------------------------------------

      - name: Create project directories
        run: |
          mkdir -p app/src/main/java/com/example/gesturerecorder
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml


      # --------------------------------------------------
      # 5. SETTINGS
      # --------------------------------------------------

      - name: Create settings.gradle.kts
        run: |
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "GestureRecorderOverlay"

          include(":app")
          EOF


      # --------------------------------------------------
      # 6. ROOT GRADLE
      # --------------------------------------------------

      - name: Create root build.gradle.kts
        run: |
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF


      # --------------------------------------------------
      # 7. GRADLE PROPERTIES
      # --------------------------------------------------

      - name: Create gradle.properties
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF


      # --------------------------------------------------
      # 8. APP GRADLE
      # --------------------------------------------------

      - name: Create app build.gradle.kts
        run: |
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.gesturerecorder"

              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.gesturerecorder"

                  minSdk = 26

                  targetSdk = 35

                  versionCode = 2

                  versionName = "2.0"
              }
          }

          dependencies {

              implementation(
                  "androidx.core:core-ktx:1.15.0"
              )

              implementation(
                  "androidx.appcompat:appcompat:1.7.0"
              )
          }
          EOF


      # --------------------------------------------------
      # 9. MANIFEST
      # --------------------------------------------------

      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.SYSTEM_ALERT_WINDOW"/>

              <application
                  android:allowBackup="true"
                  android:label="Gesture Recorder"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN"/>

                          <category
                              android:name="android.intent.category.LAUNCHER"/>

                      </intent-filter>

                  </activity>


                  <service
                      android:name=".GestureAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false"
                      android:label="Gesture Replay Service">

                      <intent-filter>

                          <action
                              android:name="android.accessibilityservice.AccessibilityService"/>

                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config"/>

                  </service>


                  <service
                      android:name=".OverlayService"
                      android:exported="false"/>

              </application>

          </manifest>
          EOF


      # --------------------------------------------------
      # 10. STRINGS
      # --------------------------------------------------

      - name: Create strings.xml
        run: |
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>

              <string name="app_name">
                  Gesture Recorder
              </string>

              <string name="accessibility_description">
                  Replays saved touch gestures using Android accessibility gestures.
              </string>

          </resources>
          EOF


      # --------------------------------------------------
      # 11. STYLES
      # --------------------------------------------------

      - name: Create styles.xml
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">
                      sans
                  </item>

                  <item name="android:colorAccent">
                      #1565C0
                  </item>

              </style>

          </resources>
          EOF


      # --------------------------------------------------
      # 12. ACCESSIBILITY CONFIG
      # --------------------------------------------------

      - name: Create accessibility configuration
        run: |
          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"

              android:description="@string/accessibility_description"

              android:accessibilityEventTypes="typeAllMask"

              android:accessibilityFeedbackType="feedbackGeneric"

              android:accessibilityFlags="flagDefault"

              android:canRetrieveWindowContent="false"

              android:canPerformGestures="true"

              android:notificationTimeout="50"/>

          EOF


      # --------------------------------------------------
      # 13. GESTURE POINT
      # --------------------------------------------------

      - name: Create GesturePoint.kt
        run: |
          cat > app/src/main/java/com/example/gesturerecorder/GesturePoint.kt <<'EOF'
          package com.example.gesturerecorder

          data class GesturePoint(
              val x: Float,
              val y: Float,
              val timeMs: Long
          )
          EOF


      # --------------------------------------------------
      # 14. GESTURE STORAGE
      # --------------------------------------------------

      - name: Create GestureStore.kt
        run: |
          cat > app/src/main/java/com/example/gesturerecorder/GestureStore.kt <<'EOF'
          package com.example.gesturerecorder

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject

          object GestureStore {

              private const val PREFS =
                  "gesture_store"

              private const val KEY =
                  "points"


              fun save(
                  context: Context,
                  points: List<GesturePoint>
              ) {

                  val array =
                      JSONArray()

                  points.forEach { point ->

                      array.put(
                          JSONObject().apply {

                              put(
                                  "x",
                                  point.x
                              )

                              put(
                                  "y",
                                  point.y
                              )

                              put(
                                  "t",
                                  point.timeMs
                              )
                          }
                      )
                  }

                  context
                      .getSharedPreferences(
                          PREFS,
                          Context.MODE_PRIVATE
                      )
                      .edit()
                      .putString(
                          KEY,
                          array.toString()
                      )
                      .apply()
              }


              fun load(
                  context: Context
              ): List<GesturePoint> {

                  val raw =
                      context
                          .getSharedPreferences(
                              PREFS,
                              Context.MODE_PRIVATE
                          )
                          .getString(
                              KEY,
                              null
                          )
                          ?: return emptyList()


                  val array =
                      JSONArray(raw)


                  return buildList {

                      for (
                          i in 0 until array.length()
                      ) {

                          val objectData =
                              array.getJSONObject(i)

                          add(
                              GesturePoint(

                                  objectData
                                      .getDouble("x")
                                      .toFloat(),

                                  objectData
                                      .getDouble("y")
                                      .toFloat(),

                                  objectData
                                      .getLong("t")
                              )
                          )
                      }
                  }
              }
          }
          EOF


      # --------------------------------------------------
      # 15. ACCESSIBILITY SERVICE
      # --------------------------------------------------

      - name: Create GestureAccessibilityService.kt
        run: |
          cat > app/src/main/java/com/example/gesturerecorder/GestureAccessibilityService.kt <<'EOF'
          package com.example.gesturerecorder

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.view.accessibility.AccessibilityEvent

          class GestureAccessibilityService :
              AccessibilityService() {

              companion object {

                  var instance:
                      GestureAccessibilityService? = null
              }


              override fun onServiceConnected() {

                  super.onServiceConnected()

                  instance = this
              }


              override fun onAccessibilityEvent(
                  event: AccessibilityEvent?
              ) {
              }


              override fun onInterrupt() {
              }


              fun replay(
                  points: List<GesturePoint>,
                  finished: () -> Unit
              ) {

                  if (points.isEmpty()) {

                      finished()

                      return
                  }


                  val path =
                      Path()


                  path.moveTo(
                      points[0].x,
                      points[0].y
                  )


                  for (
                      i in 1 until points.size
                  ) {

                      path.lineTo(
                          points[i].x,
                          points[i].y
                      )
                  }


                  val duration =
                      (
                          points.last().timeMs -
                          points.first().timeMs
                      ).coerceIn(
                          1L,
                          60000L
                      )


                  val stroke =
                      GestureDescription
                          .StrokeDescription(
                              path,
                              0L,
                              duration
                          )


                  val gesture =
                      GestureDescription
                          .Builder()
                          .addStroke(stroke)
                          .build()


                  dispatchGesture(

                      gesture,

                      object :
                          GestureResultCallback() {

                          override fun onCompleted(
                              gestureDescription:
                              GestureDescription?
                          ) {

                              finished()
                          }


                          override fun onCancelled(
                              gestureDescription:
                              GestureDescription?
                          ) {

                              finished()
                          }
                      },

                      null
                  )
              }
          }
          EOF


      # --------------------------------------------------
      # 16. OVERLAY SERVICE
      # --------------------------------------------------

      - name: Create OverlayService.kt
        run: |
          cat > app/src/main/java/com/example/gesturerecorder/OverlayService.kt <<'EOF'
