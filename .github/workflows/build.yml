name: Build Gesture Recorder - Android 16

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Verified APK
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # JAVA
      # --------------------------------------------------

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # --------------------------------------------------
      # ANDROID SDK
      # --------------------------------------------------

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"


      # --------------------------------------------------
      # CREATE PROJECT
      # --------------------------------------------------

      - name: Create Android project
        shell: bash
        run: |

          set -e

          mkdir -p app/src/main/java/com/gesture/replayer
          mkdir -p app/src/main/res/values


      # --------------------------------------------------
      # SETTINGS
      # --------------------------------------------------

      - name: Create settings.gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "GestureRecorder"

          include(":app")
          EOF


      # --------------------------------------------------
      # ROOT BUILD
      # --------------------------------------------------

      - name: Create root build.gradle
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.9.2' apply false
          }
          EOF


      # --------------------------------------------------
      # GRADLE PROPERTIES
      # --------------------------------------------------

      - name: Create gradle.properties
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF


      # --------------------------------------------------
      # APP BUILD
      # --------------------------------------------------

      - name: Create app build.gradle
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {

              namespace 'com.gesture.replayer'

              compileSdk 36

              defaultConfig {

                  applicationId 'com.gesture.replayer.android16'

                  minSdk 26

                  targetSdk 36

                  versionCode 1

                  versionName '1.0'
              }

              buildTypes {

                  debug {
                      minifyEnabled false
                      debuggable true
                  }

                  release {
                      minifyEnabled false
                      debuggable false
                  }
              }

              compileOptions {

                  sourceCompatibility JavaVersion.VERSION_17

                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF


      # --------------------------------------------------
      # STRINGS
      # --------------------------------------------------

      - name: Create strings.xml
        run: |
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <string name="app_name">
                  Gesture Recorder
              </string>

          </resources>
          EOF


      # --------------------------------------------------
      # THEME
      # --------------------------------------------------

      - name: Create themes.xml
        run: |
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">
                      sans
                  </item>

                  <item name="android:windowActionModeOverlay">
                      true
                  </item>

              </style>

          </resources>
          EOF


      # --------------------------------------------------
      # MANIFEST
      # --------------------------------------------------

      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <application

                  android:allowBackup="true"

                  android:label="@string/app_name"

                  android:supportsRtl="true"

                  android:theme="@style/AppTheme">

                  <activity

                      android:name=".MainActivity"

                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # --------------------------------------------------
      # MAIN ACTIVITY
      # --------------------------------------------------

      - name: Create MainActivity.java
        run: |
          cat > app/src/main/java/com/gesture/replayer/MainActivity.java <<'EOF'
          package com.gesture.replayer;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  LinearLayout layout =
                      new LinearLayout(this);

                  layout.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  layout.setGravity(
                      Gravity.CENTER
                  );

                  layout.setPadding(
                      40,
                      40,
                      40,
                      40
                  );

                  TextView title =
                      new TextView(this);

                  title.setText(
                      "Gesture Recorder"
                  );

                  title.setTextSize(28);

                  title.setTextColor(
                      Color.BLACK
                  );

                  title.setGravity(
                      Gravity.CENTER
                  );

                  TextView status =
                      new TextView(this);

                  status.setText(
                      "Android 16 test build"
                  );

                  status.setTextSize(18);

                  status.setGravity(
                      Gravity.CENTER
                  );

                  Button test =
                      new Button(this);

                  test.setText(
                      "TEST APP"
                  );

                  test.setOnClickListener(
                      v -> status.setText(
                          "App is working!"
                      )
                  );

                  layout.addView(title);

                  layout.addView(status);

                  layout.addView(test);

                  setContentView(layout);
              }
          }
          EOF


      # --------------------------------------------------
      # GRADLE
      # --------------------------------------------------

      - name: Install Gradle
        run: |
          sudo apt-get update

          sudo apt-get install -y gradle


      # --------------------------------------------------
      # CREATE WRAPPER
      # --------------------------------------------------

      - name: Create Gradle wrapper
        run: |
          gradle wrapper \
            --gradle-version 8.11.1


      # --------------------------------------------------
      # BUILD
      # --------------------------------------------------

      - name: Build APK
        run: |
          chmod +x ./gradlew

          ./gradlew \
            clean \
            assembleDebug \
            --stacktrace


      # --------------------------------------------------
      # CHECK APK EXISTS
      # --------------------------------------------------

      - name: Check APK
        run: |

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
              echo "ERROR: APK was not created."
              exit 1
          fi

          echo "APK successfully created."

          ls -lh "$APK"


      # --------------------------------------------------
      # VERIFY APK SIGNATURE
      # --------------------------------------------------

      - name: Verify APK
        run: |

          APK="app/build/outputs/apk/debug/app-debug.apk"

          $ANDROID_HOME/build-tools/36.0.0/apksigner \
            verify \
            --verbose \
            "$APK"


      # --------------------------------------------------
      # VERIFY PACKAGE
      # --------------------------------------------------

      - name: Verify Android package
        run: |

          APK="app/build/outputs/apk/debug/app-debug.apk"

          $ANDROID_HOME/build-tools/36.0.0/aapt2 \
            dump badging \
            "$APK"


      # --------------------------------------------------
      # UPLOAD APK
      # --------------------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: Gesture-Recorder-Android-16-APK

          path: app/build/outputs/apk/debug/app-debug.apk

          if-no-files-found: error
