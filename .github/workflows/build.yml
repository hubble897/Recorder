name: Build Recorder APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Download the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Find the Gradle project automatically
      - name: Find Gradle project
        shell: bash
        run: |
          echo "Repository contents:"
          find . -maxdepth 3 -type f | sort | head -200

          echo ""
          echo "Searching for Gradle wrapper..."

          GRADLEW=$(find . -type f -name "gradlew" | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: No gradlew file was found."
            echo ""
            echo "Searching for Gradle build files..."
            find . -type f \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
            \) -print

            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          # Remove ./ from the beginning
          PROJECT_DIR="${PROJECT_DIR#./}"

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="."
          fi

          echo "Found Gradle project at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 4. Make Gradle executable
      - name: Make Gradle executable
        shell: bash
        run: |
          chmod +x "$PROJECT_DIR/gradlew"
          echo "Gradle wrapper:"
          "$PROJECT_DIR/gradlew" --version

      # 5. Build the debug APK
      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "Building Android APK..."
          ./gradlew clean assembleDebug --stacktrace

      # 6. Find the generated APK
      - name: Find APK
        shell: bash
        run: |
          echo "Searching for APK files..."

          find "$PROJECT_DIR" -type f -name "*.apk" -print

          APK_COUNT=$(find "$PROJECT_DIR" -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was produced."
            exit 1
          fi

          echo "APK successfully created."

      # 7. Upload APK as GitHub artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Recorder-debug-apk
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
