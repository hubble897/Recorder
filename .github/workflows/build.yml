name: Build Gesture Recorder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Create Android project
        run: |

          mkdir -p app/src/main/java/com/example/gesturerecorder
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "GestureRecorder"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.gesturerecorder'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.gesturerecorder'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Gesture Recorder</string>
              <string name="accessibility_description">Gesture Recorder Service</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1565C0</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/accessibility_description"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="false"
              android:notificationTimeout="50" />
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".GestureAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">

                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />

                  </service>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/example/gesturerecorder/MainActivity.java <<'EOF'
          package com.example.gesturerecorder;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              TextView status;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(30, 30, 30, 30);
                  layout.setGravity(Gravity.CENTER_HORIZONTAL);

                  TextView title = new TextView(this);
                  title.setText("Gesture Recorder");
                  title.setTextSize(28);
                  title.setTextColor(Color.BLACK);
                  title.setGravity(Gravity.CENTER);

                  layout.addView(title);

                  status = new TextView(this);
                  status.setText("Ready");
                  status.setTextSize(18);
                  status.setPadding(0, 30, 0, 20);

                  layout.addView(status);

                  Button record = new Button(this);
                  record.setText("START RECORDING");
                  record.setOnClickListener(v ->
                      status.setText("Recording..."));

                  layout.addView(record);

                  Button stop = new Button(this);
                  stop.setText("STOP RECORDING");
                  stop.setOnClickListener(v ->
                      status.setText("Recording stopped"));

                  layout.addView(stop);

                  Button replay = new Button(this);
                  replay.setText("REPLAY GESTURES");
                  replay.setOnClickListener(v ->
                      status.setText("Replay started"));

                  layout.addView(replay);

                  Button stopReplay = new Button(this);
                  stopReplay.setText("STOP REPLAY");
                  stopReplay.setOnClickListener(v ->
                      status.setText("Replay stopped"));

                  layout.addView(stopReplay);

                  Button accessibility = new Button(this);
                  accessibility.setText("ACCESSIBILITY SETTINGS");
                  accessibility.setOnClickListener(v ->
                      startActivity(
                          new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
                      ));

                  layout.addView(accessibility);

                  setContentView(layout);
              }
          }
          EOF

          cat > app/src/main/java/com/example/gesturerecorder/GestureAccessibilityService.java <<'EOF'
          package com.example.gesturerecorder;

          import android.accessibilityservice.AccessibilityService;
          import android.view.accessibility.AccessibilityEvent;

          public class GestureAccessibilityService
                  extends AccessibilityService {

              public static GestureAccessibilityService instance;

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
              }

              @Override
              public void onAccessibilityEvent(
                      AccessibilityEvent event) {
              }

              @Override
              public void onInterrupt() {
              }

              @Override
              public void onDestroy() {
                  instance = null;
                  super.onDestroy();
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle --no-daemon clean assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-debug.apk artifact/GestureRecorder.apk
          ls -lh artifact/GestureRecorder.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GestureRecorder-APK
          path: artifact/GestureRecorder.apk
          if-no-files-found: error
          retention-days: 14
