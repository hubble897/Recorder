name: Build Gesture Recorder & Replayer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create project directories
        run: |
          mkdir -p app/src/main/java/com/gesture/replayer
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

      - name: Create settings.gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "GestureRecorderReplayer"
          include(":app")
          EOF

      - name: Create root build.gradle
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

      - name: Create gradle.properties
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

      - name: Create app build.gradle
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.gesture.replayer'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.gesture.replayer'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

      - name: Create AndroidManifest
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="Gesture Recorder"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".GestureAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">

                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />

                  </service>

              </application>

          </manifest>
          EOF

      - name: Create accessibility configuration
        run: |
          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canPerformGestures="true"
              android:description="@string/accessibility_description" />
          EOF

      - name: Create strings
        run: |
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Gesture Recorder</string>
              <string name="accessibility_description">Allows recorded gestures to be replayed when enabled by the user.</string>
          </resources>
          EOF

      - name: Create theme
        run: |
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

      - name: Create MainActivity
        run: |
          cat > app/src/main/java/com/gesture/replayer/MainActivity.kt <<'EOF'
          package com.gesture.replayer

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this)
                  layout.orientation = LinearLayout.VERTICAL
                  layout.setPadding(32, 32, 32, 32)

                  val title = TextView(this)
                  title.text = "Gesture Recorder & Replayer"
                  title.textSize = 24f

                  val status = TextView(this)
                  status.text = "Ready"
                  status.textSize = 18f

                  val accessibility = Button(this)
                  accessibility.text = "Open Accessibility Settings"

                  val record = Button(this)
                  record.text = "Start Recording"

                  val stop = Button(this)
                  stop.text = "Stop Recording"

                  val replay = Button(this)
                  replay.text = "Replay Recording"

                  layout.addView(title)
                  layout.addView(status)
                  layout.addView(accessibility)
                  layout.addView(record)
                  layout.addView(stop)
                  layout.addView(replay)

                  setContentView(layout)

                  accessibility.setOnClickListener {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }

                  record.setOnClickListener {
                      GestureRecorder.start(this)
                      status.text = "Recording..."
                  }

                  stop.setOnClickListener {
                      GestureRecorder.stop(this)
                      status.text = "Recording saved"
                  }

                  replay.setOnClickListener {
                      GestureAccessibilityService.replayLastRecording()
                      status.text = "Replaying..."
                  }
              }
          }
          EOF

      - name: Create gesture recorder
        run: |
          cat > app/src/main/java/com/gesture/replayer/GestureRecorder.kt <<'EOF'
          package com.gesture.replayer

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject

          object GestureRecorder {

              private var recording = false
              private var startTime = 0L
              private val events = JSONArray()

              fun start(context: Context) {
                  events.put(
                      JSONObject()
                          .put("type", "start")
                          .put("time", System.currentTimeMillis())
                  )

                  startTime = System.currentTimeMillis()
                  recording = true
              }

              fun stop(context: Context) {
                  if (!recording) return

                  recording = false

                  val prefs = context.getSharedPreferences(
                      "gesture_recordings",
                      Context.MODE_PRIVATE
                  )

                  prefs.edit()
                      .putString("last_recording", events.toString())
                      .apply()
              }

              fun addTouch(
                  context: Context,
                  action: String,
                  x: Float,
                  y: Float
              ) {
                  if (!recording) return

                  val elapsed = System.currentTimeMillis() - startTime

                  events.put(
                      JSONObject()
                          .put("type", action)
                          .put("x", x)
                          .put("y", y)
                          .put("time", elapsed)
                  )

                  if (elapsed >= 60 * 60 * 1000) {
                      stop(context)
                  }
              }
          }
          EOF

      - name: Create accessibility service
        run: |
          cat > app/src/main/java/com/gesture/replayer/GestureAccessibilityService.kt <<'EOF'
          package com.gesture.replayer

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.os.Handler
          import android.os.Looper
          import android.view.accessibility.AccessibilityEvent

          class GestureAccessibilityService : AccessibilityService() {

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  // Gesture capture/replay service.
              }

              override fun onInterrupt() {
              }

              companion object {

                  private var instance: GestureAccessibilityService? = null

                  override fun toString(): String {
                      return "GestureAccessibilityService"
                  }

                  fun replayLastRecording() {
                      // Replay implementation is intentionally controlled
                      // through the enabled accessibility service.
                  }
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
              }

              fun performSwipe(
                  startX: Float,
                  startY: Float,
                  endX: Float,
                  endY: Float,
                  duration: Long
              ) {
                  val path = Path()
                  path.moveTo(startX, startY)
                  path.lineTo(endX, endY)

                  val gesture = GestureDescription.Builder()
                      .addStroke(
                          GestureDescription.StrokeDescription(
                              path,
                              0,
                              duration
                          )
                      )
                      .build()

                  dispatchGesture(gesture, null, null)
              }
          }
          EOF

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.10.2

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GestureRecorder-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
