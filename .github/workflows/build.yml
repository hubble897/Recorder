name: Build Gesture Recorder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          wget -q \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -O /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /opt

          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

          /opt/gradle-8.9/bin/gradle --version

      - name: Create project folders
        run: |
          mkdir -p app/src/main/java/com/example/gesturerecorder
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p output

      - name: Create settings.gradle.kts
        run: |
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "GestureRecorder"

          include(":app")
          EOF

      - name: Create root build.gradle.kts
        run: |
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

      - name: Create gradle.properties
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

      - name: Create app build.gradle.kts
        run: |
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.gesturerecorder"

              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.gesturerecorder"

                  minSdk = 26

                  targetSdk = 35

                  versionCode = 1

                  versionName = "1.0"
              }
          }

          dependencies {
              implementation(
                  "androidx.core:core-ktx:1.15.0"
              )

              implementation(
                  "androidx.appcompat:appcompat:1.7.0"
              )
          }
          EOF

      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.SYSTEM_ALERT_WINDOW"/>

              <application
                  android:allowBackup="true"
                  android:label="Gesture Recorder"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN"/>

                          <category
                              android:name="android.intent.category.LAUNCHER"/>

                      </intent-filter>

                  </activity>

                  <service
                      android:name=".GestureAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false"
                      android:label="Gesture Replay Service">

                      <intent-filter>

                          <action
                              android:name="android.accessibilityservice.AccessibilityService"/>

                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config"/>

                  </service>

                  <service
                      android:name=".OverlayService"
                      android:exported="false"/>

              </application>

          </manifest>
          EOF

      - name: Create strings.xml
        run: |
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>

              <string name="app_name">
                  Gesture Recorder
              </string>

              <string name="accessibility_description">
                  Replays saved gestures using Android accessibility gestures.
              </string>

          </resources>
          EOF

      - name: Create styles.xml
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:colorAccent">
                      #1565C0
                  </item>

              </style>

          </resources>
          EOF

      - name: Create accessibility configuration
        run: |
          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/accessibility_description"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canRetrieveWindowContent="false"
              android:canPerformGestures="true"
              android:notificationTimeout="50"/>
          EOF

      - name: Create GesturePoint.kt
        run: |
          cat > app/src/main/java/com/example/gesturerecorder/GesturePoint.kt <<'EOF'
          package com.example.gesturerecorder

          data class GesturePoint(
              val x: Float,
              val y: Float,
              val timeMs: Long
          )
          EOF

      - name: Create GestureStore.kt
        run: |
          cat > app/src/main/java/com/example/gesturerecorder/GestureStore.kt <<'EOF'
          package com.example.gesturerecorder

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject

          object GestureStore {

              private const val PREFS = "gesture_store"

              private const val KEY = "points"

              fun save(
                  context: Context,
                  points: List<GesturePoint>
              ) {

                  val array = JSONArray()

                  points.forEach {

                      array.put(
                          JSONObject().apply {

                              put("x", it.x)

                              put("y", it.y)

                              put("t", it.timeMs)
                          }
                      )
                  }

                  context
                      .getSharedPreferences(
                          PREFS,
                          Context.MODE_PRIVATE
                      )
                      .edit()
                      .putString(
                          KEY,
                          array.toString()
                      )
                      .apply()
              }

              fun load(
                  context: Context
              ): List<GesturePoint> {

                  val raw =
                      context
                          .getSharedPreferences(
                              PREFS,
                              Context.MODE_PRIVATE
                          )
                          .getString(
                              KEY,
                              null
                          )
                          ?: return emptyList()

                  val array =
                      JSONArray(raw)

                  return buildList {

                      for (
                          i in 0 until array.length()
                      ) {

                          val item =
                              array.getJSONObject(i)

                          add(
                              GesturePoint(
                                  item.getDouble("x").toFloat(),
                                  item.getDouble("y").toFloat(),
                                  item.getLong("t")
                              )
                          )
                      }
                  }
              }
          }
          EOF

      - name: Create GestureAccessibilityService.kt
        run: |
          cat > app/src/main/java/com/example/gesturerecorder/GestureAccessibilityService.kt <<'EOF'
          package com.example.gesturerecorder

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.view.accessibility.AccessibilityEvent

          class GestureAccessibilityService :
              AccessibilityService() {

              companion object {

                  var instance:
                      GestureAccessibilityService? = null
              }

              override fun onServiceConnected() {

                  super.onServiceConnected()

                  instance = this
              }

              override fun onAccessibilityEvent(
                  event: AccessibilityEvent?
              ) {
              }

              override fun onInterrupt() {
              }

              fun replay(
                  points: List<GesturePoint>,
                  finished: () -> Unit
              ) {

                  if (points.isEmpty()) {

                      finished()

                      return
                  }

                  val path = Path()

                  path.moveTo(
                      points.first().x,
                      points.first().y
                  )

                  for (
                      i in 1 until points.size
                  ) {

                      path.lineTo(
                          points[i].x,
                          points[i].y
                      )
                  }

                  val duration =
                      (
                          points.last().timeMs -
                          points.first().timeMs
                      ).coerceIn(
                          1L,
                          60000L
                      )

                  val stroke =
                      GestureDescription
                          .StrokeDescription(
                              path,
                              0L,
                              duration
                          )

                  val gesture =
                      GestureDescription
                          .Builder()
                          .addStroke(stroke)
                          .build()

                  dispatchGesture(
                      gesture,

                      object :
                          GestureResultCallback() {

                          override fun onCompleted(
                              gestureDescription:
                              GestureDescription?
                          ) {

                              finished()
                          }

                          override fun onCancelled(
                              gestureDescription:
                              GestureDescription?
                          ) {

                              finished()
                          }
                      },

                      null
                  )
              }
          }
          EOF

      - name: Create OverlayService.kt
        run: |
          cat > app/src/main/java/com/example/gesturerecorder/OverlayService.kt <<'EOF'
          package com.example.gesturerecorder

          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.os.IBinder
          import android.view.Gravity
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.Toast

          class OverlayService :
              Service() {

              private lateinit var
                  windowManager: WindowManager

              private lateinit var
                  panel: LinearLayout

              private var recording = false

              private var startTime = 0L

              private val points =
                  mutableListOf<GesturePoint>()

              companion object {

                  fun stop(
                      context: Context
                  ) {

                      context.stopService(
                          Intent(
                              context,
                              OverlayService::class.java
                          )
                      )
                  }
              }

              override fun onCreate() {

                  super.onCreate()

                  windowManager =
                      getSystemService(
                          WINDOW_SERVICE
                      ) as WindowManager

                  createOverlay()
              }

              private fun createOverlay() {

                  panel =
                      LinearLayout(this).apply {

                          orientation =
                              LinearLayout.HORIZONTAL

                          setPadding(
                              4,
                              4,
                              4,
                              4
                          )

                          setBackgroundColor(
                              Color.WHITE
                          )
                      }

                  val record =
                      Button(this).apply {

                          text = "● REC"

                          setOnClickListener {

                              recording = true

                              points.clear()

                              startTime =
                                  System.currentTimeMillis()

                              Toast.makeText(
                                  this@OverlayService,
                                  "Recording started",
                                  Toast.LENGTH_SHORT
                              ).show()
                          }
                     
