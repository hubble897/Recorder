name: Build Gesture Recorder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Real Installable APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          wget -q \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            -O gradle.zip

          unzip -q gradle.zip

          echo "$GITHUB_WORKSPACE/gradle-8.7/bin" >> "$GITHUB_PATH"

          gradle --version

      - name: Create clean Android project
        run: |

          rm -rf gesture-project

          mkdir -p gesture-project/app/src/main/java/com/gesture/recorder
          mkdir -p gesture-project/app/src/main/res/values
          mkdir -p gesture-project/app/src/main/res/xml

          cd gesture-project

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "GestureRecorder"

          include ":app"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {

              namespace 'com.gesture.recorder'

              compileSdk 35

              defaultConfig {

                  applicationId 'com.gesture.recorder'

                  minSdk 26

                  targetSdk 35

                  versionCode 1

                  versionName '1.0'
              }

              signingConfigs {
                  debug {
                      storeFile file("${System.properties['user.home']}/.android/debug.keystore")
                  }
              }

              buildTypes {

                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>

              <string name="app_name">
                  Gesture Recorder
              </string>

              <string name="accessibility_description">
                  Gesture Recorder accessibility service
              </string>

          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">
                      sans
                  </item>

                  <item name="android:windowLightStatusBar">
                      true
                  </item>

                  <item name="android:statusBarColor">
                      #FFFFFF
                  </item>

              </style>

          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/accessibility_description"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canPerformGestures="true"
              android:notificationTimeout="50" />
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

                  <service
                      android:name=".GestureAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">

                      <intent-filter>

                          <action
                              android:name="android.accessibilityservice.AccessibilityService" />

                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />

                  </service>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/gesture/recorder/MainActivity.java <<'EOF'
          package com.gesture.recorder;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              private TextView status;

              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL);

                  root.setPadding(
                          30,
                          30,
                          30,
                          30);

                  root.setGravity(
                          Gravity.CENTER_HORIZONTAL);

                  TextView title =
                          new TextView(this);

                  title.setText(
                          "Gesture Recorder");

                  title.setTextSize(28);

                  title.setTextColor(
                          Color.BLACK);

                  title.setGravity(
                          Gravity.CENTER);

                  root.addView(title);

                  status =
                          new TextView(this);

                  status.setText(
                          "Ready");

                  status.setTextSize(18);

                  status.setPadding(
                          0,
                          30,
                          0,
                          20);

                  root.addView(status);

                  Button record =
                          new Button(this);

                  record.setText(
                          "START RECORDING");

                  record.setOnClickListener(
                          v -> status.setText(
                                  "Recording..."));

                  root.addView(record);

                  Button stop =
                          new Button(this);

                  stop.setText(
                          "STOP RECORDING");

                  stop.setOnClickListener(
                          v -> status.setText(
                                  "Recording stopped"));

                  root.addView(stop);

                  Button replay =
                          new Button(this);

                  replay.setText(
                          "REPLAY GESTURES");

                  replay.setOnClickListener(
                          v -> status.setText(
                                  "Replay started"));

                  root.addView(replay);

                  Button stopReplay =
                          new Button(this);

                 
