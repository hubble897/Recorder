name: Build Gesture Recorder Android 16

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # 1. Create a completely fresh Android project
      # ------------------------------------------------------------

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p GestureRecorder/app/src/main/java/com/example/gesturerecorder
          mkdir -p GestureRecorder/app/src/main/res/xml
          mkdir -p GestureRecorder/app/src/main/res/values

          cd GestureRecorder

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "GestureRecorder"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.gesturerecorder'
              compileSdk 36

              defaultConfig {
                  applicationId 'com.example.gesturerecorder'
                  minSdk 26
                  targetSdk 36
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }

                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
          }
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="black">#000000</color>
              <color name="white">#FFFFFF</color>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:navigationBarColor">@color/black</item>
              </style>
          </resources>
          EOF

          # --------------------------------------------------------
          # Accessibility service configuration
          # --------------------------------------------------------

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/accessibility_description"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="50"
              android:canRetrieveWindowContent="false"
              android:canPerformGestures="true"
              android:settingsActivity="com.example.gesturerecorder.MainActivity" />
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Gesture Recorder</string>
              <string name="accessibility_description">Records and replays touch gestures when explicitly enabled by the user.</string>
          </resources>
          EOF

          # --------------------------------------------------------
          # AndroidManifest
          # --------------------------------------------------------

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".GestureAccessibilityService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">

                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />

                  </service>

              </application>

          </manifest>
          EOF

          # --------------------------------------------------------
          # MainActivity
          # --------------------------------------------------------

          cat > app/src/main/java/com/example/gesturerecorder/MainActivity.kt <<'EOF'
          package com.example.gesturerecorder

          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private lateinit var status: TextView
              private lateinit var count: TextView

              private lateinit var recordButton: Button
              private lateinit var stopButton: Button
              private lateinit var replayButton: Button
              private lateinit var clearButton: Button
              private lateinit var settingsButton: Button

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  buildInterface()

                  recordButton.setOnClickListener {
                      if (!isAccessibilityEnabled()) {
                          status.text = "Accessibility service is OFF"
                          openAccessibilitySettings()
                          return@setOnClickListener
                      }

                      GestureController.startRecording()

                      status.text = "RECORDING"
                      updateCount()
                      updateButtons()
                  }

                  stopButton.setOnClickListener {
                      GestureController.stopRecording()

                      status.text = "Recording stopped"
                      updateCount()
                      updateButtons()
                  }

                  replayButton.setOnClickListener {
                      if (!isAccessibilityEnabled()) {
                          status.text = "Accessibility service is OFF"
                          openAccessibilitySettings()
                          return@setOnClickListener
                      }

                      if (GestureController.gestureCount() == 0) {
                          status.text = "Nothing recorded"
                          return@setOnClickListener
                      }

                      status.text = "REPLAYING..."

                      GestureController.replay {
                          runOnUiThread {
                              status.text = "Replay finished"
                              updateButtons()
                          }
                      }

                      updateButtons()
                  }

                  clearButton.setOnClickListener {
                      GestureController.clearRecording()

                      status.text = "Recording cleared"
                      updateCount()
                      updateButtons()
                  }

                  settingsButton.setOnClickListener {
                      openAccessibilitySettings()
                  }

                  updateCount()
                  updateButtons()
              }

              private fun buildInterface() {

                  val root = LinearLayout(this)

                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(32, 32, 32, 32)
                  root.gravity = Gravity.CENTER_HORIZONTAL

                  val title = TextView(this)
                  title.text = "Gesture Recorder"
                  title.textSize = 28f
                  title.gravity = Gravity.CENTER
                  title.setPadding(0, 0, 0, 24)

                  root.addView(
                      title,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  )

                  status = TextView(this)
                  status.textSize = 20f
                  status.gravity = Gravity.CENTER
                  status.text = "READY"
                  status.setPadding(0, 0, 0, 12)

                  root.addView(
                      status,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  )

                  count = TextView(this)
                  count.textSize = 17f
                  count.gravity = Gravity.CENTER
                  count.setPadding(0, 0, 0, 24)

                  root.addView(
                      count,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  )

                  recordButton = Button(this)
                  recordButton.text = "START RECORDING"
                  root.addView(fullButton(recordButton))

                  stopButton = Button(this)
                  stopButton.text = "STOP RECORDING"
                  root.addView(fullButton(stopButton))

                  replayButton = Button(this)
                  replayButton.text = "REPLAY"
                  root.addView(fullButton(replayButton))

                  clearButton = Button(this)
                  clearButton.text = "CLEAR RECORDING"
                  root.addView(fullButton(clearButton))

                  settingsButton = Button(this)
                  settingsButton.text = "OPEN ACCESSIBILITY SETTINGS"
                  root.addView(fullButton(settingsButton))

                  setContentView(root)
              }

              private fun fullButton(button: Button): LinearLayout.LayoutParams {
                  return LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  ).apply {
                      setMargins(0, 8, 0, 8)
                  }
              }

              private fun updateCount() {
                  count.text = "Recorded gestures: ${GestureController.gestureCount()}"
              }

              private fun updateButtons() {
                  val recording = GestureController.isRecording()
                  val replaying = GestureController.isReplaying()

                  recordButton.isEnabled = !recording && !replaying
                  stopButton.isEnabled = recording
                  replayButton.isEnabled =
                      !recording &&
                      !replaying &&
                      GestureController.gestureCount() > 0
                  clearButton.isEnabled =
                      !recording &&
                      !replaying &&
                      GestureController.gestureCount() > 0
              }

              private fun isAccessibilityEnabled(): Boolean {

                  val expected = ComponentName(
                      this,
                      GestureAccessibilityService::class.java
                  )

                  val enabledServices = Settings.Secure.getString(
                      contentResolver,
                      Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  ) ?: return false

                  return enabledServices
                      .split(':')
                      .any {
                          ComponentName.unflattenFromString(it) == expected
                      }
              }

              private fun openAccessibilitySettings() {
                  startActivity(
                      Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
                  )
              }

              override fun onResume() {
                  super.onResume()

                  if (::status.isInitialized) {
                      if (isAccessibilityEnabled()) {
                          status.text = "Accessibility service ON"
                      } else {
                          status.text = "Accessibility service OFF"
                      }

                      updateCount()
                      updateButtons()
                  }
              }
          }
          EOF

          # --------------------------------------------------------
          # Gesture data
          # --------------------------------------------------------

          cat > app/src/main/java/com/example/gesturerecorder/GesturePoint.kt <<'EOF'
          package com.example.gesturerecorder

          data class GesturePoint(
              val action: Int,
              val x: Float,
              val y: Float,
              val time: Long
          )
          EOF

          # --------------------------------------------------------
          # Gesture controller
          # --------------------------------------------------------

          cat > app/src/main/java/com/example/gesturerecorder/GestureController.kt <<'EOF'
          package com.example.gesturerecorder

          object GestureController {

              private val points = mutableListOf<GesturePoint>()

              @Volatile
              private var recording = false

              @Volatile
              private var replaying = false

              @Synchronized
              fun startRecording() {
                  points.clear()
                  recording = true
              }

              @Synchronized
              fun stopRecording() {
                  recording = false
              }

              @Synchronized
              fun clearRecording() {
                  recording = false
                  points.clear()
              }

              fun isRecording(): Boolean {
                  return recording
              }

              fun isReplaying(): Boolean {
                  return replaying
              }

              @Synchronized
              fun addPoint(point: GesturePoint) {
                  if (!recording) return
                  points.add(point)
              }

              @Synchronized
              fun gestureCount(): Int {
                  return points.size
              }

              @Synchronized
              fun getPoints(): List<GesturePoint> {
                  return points.toList()
              }

              fun replay(onFinished: () -> Unit) {

                  if (replaying) return

                  val service = GestureAccessibilityService.instance

                  if (service == null) {
                      onFinished()
                      return
                  }

                  val snapshot = getPoints()

                  if (snapshot.isEmpty()) {
                      onFinished()
                      return
                  }

                  replaying = true

                  service.replay(snapshot) {
                      replaying = false
                      onFinished()
                  }
              }
          }
          EOF

          # --------------------------------------------------------
          # Accessibility service
          # --------------------------------------------------------

          cat > app/src/main/java/com/example/gesturerecorder/GestureAccessibilityService.kt <<'EOF'
          package com.example.gesturerecorder

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.AccessibilityServiceInfo
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.view.MotionEvent
          import android.view.InputDevice

          class GestureAccessibilityService : AccessibilityService() {

              companion object {
                  @Volatile
                  var instance: GestureAccessibilityService? = null
              }

              private val handler = Handler(Looper.getMainLooper())

              override fun onServiceConnected() {
                  super.onServiceConnected()

                  instance = this

                  val info = serviceInfo

                  info.flags =
                      info.flags or
                      AccessibilityServiceInfo.FLAG_REPORT_VIEW_IDS

                  if (Build.VERSION.SDK_INT >= 34) {
                      info.setMotionEventSources(
                          InputDevice.SOURCE_TOUCHSCREEN
                      )
                  }

                  serviceInfo = info
              }

              override fun onAccessibilityEvent(event: android.view.accessibility.AccessibilityEvent?) {
                  // Gesture recording uses MotionEvent rather than
                  // accessibility UI events.
              }

              override fun onInterrupt() {
                  // Required by AccessibilityService.
              }

              override fun onDestroy() {
                  instance = null
                  super.onDestroy()
              }

              override fun onMotionEvent(event: MotionEvent) {

                  if (!GestureController.isRecording()) {
                      return
                  }

                  if (event.source and InputDevice.SOURCE_TOUCHSCREEN
                      != InputDevice.SOURCE_TOUCHSCREEN) {
                      return
                  }

                  val action = event.actionMasked

                  when (action) {

                      MotionEvent.ACTION_DOWN,
                      MotionEvent.ACTION_MOVE,
                      MotionEvent.ACTION_UP -> {

                          GestureController.addPoint(
                              GesturePoint(
                                  action = action,
                                  x = event.rawX,
                                  y = event.rawY,
                                  time = event.eventTime
                              )
                          )
                      }
                  }
              }

              fun replay(
                  points: List<GesturePoint>,
                  finished: () -> Unit
              ) {

                  if (points.isEmpty()) {
                      finished()
                      return
                  }

                  val downIndex = points.indexOfFirst {
                      it.action == MotionEvent.ACTION_DOWN
                  }

                  if (downIndex < 0) {
                      finished()
                      return
                  }

                  val upIndex = points.indexOfLast {
                      it.action == MotionEvent.ACTION_UP
                  }

                  val endIndex =
                      if (upIndex >= downIndex) upIndex
                      else points.lastIndex

                  val first = points[downIndex]

                  val path = Path()

                  path.moveTo(first.x, first.y)

                  for (i in downIndex + 1..endIndex) {

                      val p = points[i]

                      when (p.action) {

                          MotionEvent.ACTION_MOVE,
                          MotionEvent.ACTION_UP -> {
                              path.lineTo(p.x, p.y)
                          }
                      }
                  }

                  val duration = if (endIndex > downIndex) {
                      (
                          points[endIndex].time -
                          points[downIndex].time
                      ).coerceIn(50L, 60000L)
                  } else {
                      100L
                  }

                  val stroke =
                      GestureDescription.StrokeDescription(
                          path,
                          0L,
                          duration
                      )

                  val gesture =
                      GestureDescription.Builder()
                          .addStroke(stroke)
                          .build()

                  dispatchGesture(
                      gesture,
                      object :
                          GestureResultCallback() {

                          override fun onCompleted(
                              gestureDescription: GestureDescription?
                          ) {
                              finished()
                          }

                          override fun onCancelled(
                              gestureDescription: GestureDescription?
                          ) {
                              finished()
                          }
                      },
                      handler
                  )
              }
          }
          EOF

          # --------------------------------------------------------
          # Download Gradle wrapper
          # --------------------------------------------------------

          chmod +x gradlew 2>/dev/null || true

      # ------------------------------------------------------------
      # 2. Install Gradle and generate wrapper
      # ------------------------------------------------------------

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Gradle wrapper
        working-directory: GestureRecorder
        run: |
          gradle wrapper --gradle-version 8.10.2

      # ------------------------------------------------------------
      # 3. Build APK
      # ------------------------------------------------------------

      - name: Build debug APK
        working-directory: GestureRecorder
        run: |
          ./gradlew clean assembleDebug --stacktrace

      # ------------------------------------------------------------
      # 4. Verify APK exists
      # ------------------------------------------------------------

      - name: Verify APK
        run: |
          set -e

          APK="GestureRecorder/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            find GestureRecorder/app/build -type f || true
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      # ------------------------------------------------------------
      # 5. Rename APK
      # ------------------------------------------------------------

      - name: Prepare APK artifact
        run: |
          mkdir -p output
          cp GestureRecorder/app/build/outputs/apk/debug/app-debug.apk \
             output/GestureRecorder-Android16.apk

          ls -lh output/GestureRecorder-Android16.apk

      # ------------------------------------------------------------
      # 6. Upload APK to GitHub Actions
      # ------------------------------------------------------------

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GestureRecorder-Android16
          path: output/GestureRecorder-Android16.apk
          if-no-files-found: error
          retention-days: 14
