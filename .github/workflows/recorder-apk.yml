name: Build Gesture Recorder - Java Android 16

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CREATE PROJECT
      # ============================================================

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p GestureRecorder/app/src/main/java/com/example/gesturerecorder
          mkdir -p GestureRecorder/app/src/main/res/xml
          mkdir -p GestureRecorder/app/src/main/res/values

          cd GestureRecorder

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "GestureRecorder"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          mkdir -p app

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.gesturerecorder'
              compileSdk 36

              defaultConfig {
                  applicationId 'com.example.gesturerecorder'
                  minSdk 26
                  targetSdk 36
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.core:core:1.15.0'
          }
          EOF

          # ========================================================
          # STRINGS
          # ========================================================

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <string name="app_name">Gesture Recorder</string>

              <string name="accessibility_description">
                  Records touch gestures and can replay recorded gestures.
              </string>

          </resources>
          EOF

          # ========================================================
          # THEME
          # ========================================================

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme"
                  parent="Theme.AppCompat.DayNight.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:navigationBarColor">#000000</item>

              </style>

          </resources>
          EOF

          # ========================================================
          # ACCESSIBILITY CONFIGURATION
          # ========================================================

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"

              android:description="@string/accessibility_description"

              android:accessibilityEventTypes="typeAllMask"

              android:accessibilityFeedbackType="feedbackGeneric"

              android:notificationTimeout="50"

              android:canRetrieveWindowContent="false"

              android:canPerformGestures="true"

              android:canRequestTouchExplorationMode="true"

              android:accessibilityFlags="flagDefault|flagSendMotionEvents" />

          EOF

          # ========================================================
          # MANIFEST
          # ========================================================

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

                  <service
                      android:name=".GestureAccessibilityService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">

                      <intent-filter>

                          <action
                              android:name="android.accessibilityservice.AccessibilityService" />

                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />

                  </service>

              </application>

          </manifest>
          EOF

          # ========================================================
          # GESTURE EVENT MODEL
          # ========================================================

          cat > app/src/main/java/com/example/gesturerecorder/GesturePoint.java <<'EOF'
          package com.example.gesturerecorder;

          public class GesturePoint {

              public final int action;
              public final float x;
              public final float y;
              public final long time;
              public final int pointerCount;

              public GesturePoint(
                      int action,
                      float x,
                      float y,
                      long time,
                      int pointerCount) {

                  this.action = action;
                  this.x = x;
                  this.y = y;
                  this.time = time;
                  this.pointerCount = pointerCount;
              }
          }
          EOF

          # ========================================================
          # GESTURE RECORDER
          # ========================================================

          cat > app/src/main/java/com/example/gesturerecorder/GestureRecorder.java <<'EOF'
          package com.example.gesturerecorder;

          import android.view.MotionEvent;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;

          public final class GestureRecorder {

              private static final List<GesturePoint> points =
                      Collections.synchronizedList(
                              new ArrayList<>()
                      );

              private static volatile boolean recording = false;

              private GestureRecorder() {
              }

              public static synchronized void start() {

                  points.clear();

                  recording = true;
              }

              public static synchronized void stop() {

                  recording = false;
              }

              public static synchronized void clear() {

                  recording = false;

                  points.clear();
              }

              public static boolean isRecording() {

                  return recording;
              }

              public static void record(MotionEvent event) {

                  if (!recording) {
                      return;
                  }

                  int action =
                          event.getActionMasked();

                  if (action != MotionEvent.ACTION_DOWN
                          && action != MotionEvent.ACTION_MOVE
                          && action != MotionEvent.ACTION_UP) {

                      return;
                  }

                  float x = event.getRawX();
                  float y = event.getRawY();

                  GesturePoint point =
                          new GesturePoint(
                                  action,
                                  x,
                                  y,
                                  event.getEventTime(),
                                  event.getPointerCount()
                          );

                  points.add(point);
              }

              public static synchronized int size() {

                  return points.size();
              }

              public static synchronized List<GesturePoint> snapshot() {

                  return new ArrayList<>(points);
              }
          }
          EOF

          # ========================================================
          # ACCESSIBILITY SERVICE
          # ========================================================

          cat > app/src/main/java/com/example/gesturerecorder/GestureAccessibilityService.java <<'EOF'
          package com.example.gesturerecorder;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.AccessibilityServiceInfo;
          import android.accessibilityservice.GestureDescription;
          import android.accessibilityservice.TouchInteractionController;
          import android.graphics.Path;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.MotionEvent;

          import java.util.List;

          public class GestureAccessibilityService
                  extends AccessibilityService {

              public static volatile GestureAccessibilityService instance;

              private final Handler handler =
                      new Handler(Looper.getMainLooper());

              private TouchInteractionController controller;

              @Override
              protected void onServiceConnected() {

                  super.onServiceConnected();

                  instance = this;

                  AccessibilityServiceInfo info =
                          getServiceInfo();

                  if (info == null) {
                      info =
                              new AccessibilityServiceInfo();
                  }

                  info.flags =
                          AccessibilityServiceInfo.FLAG_DEFAULT
                                  | AccessibilityServiceInfo.FLAG_SEND_MOTION_EVENTS;

                  info.feedbackType =
                          AccessibilityServiceInfo.FEEDBACK_GENERIC;

                  info.eventTypes =
                          android.view.accessibility.AccessibilityEvent.TYPE_ALL_MASK;

                  if (Build.VERSION.SDK_INT >= 33) {

                      controller =
                              getTouchInteractionController();

                      if (controller != null) {

                          controller.registerCallback(
                                  command -> {
                                      // Motion callbacks are registered
                                      // through the controller below.
                                  },
                                  new TouchInteractionController.Callback() {

                                      @Override
                                      public void onMotionEvent(
                                              MotionEvent event) {

                                          GestureRecorder.record(event);
                                      }

                                      @Override
                                      public void onStateChanged(
                                              int state) {

                                          // State changes are intentionally
                                          // ignored. Recording is controlled
                                          // by the app buttons.
                                      }
                                  }
                          );
                      }
                  }

                  setServiceInfo(info);
              }

              @Override
              public void onAccessibilityEvent(
                      android.view.accessibility.AccessibilityEvent event) {

                  // UI accessibility events are not used for
                  // gesture recording.
              }

              @Override
              public void onInterrupt() {
              }

              @Override
              public void onDestroy() {

                  instance = null;

                  super.onDestroy();
              }

              public void replay(
                      List<GesturePoint> recorded,
                      final Runnable finished) {

                  if (recorded == null
                          || recorded.isEmpty()) {

                      if (finished != null) {
                          finished.run();
                      }

                      return;
                  }

                  GesturePoint first = null;
                  GesturePoint last = null;

                  for (GesturePoint p : recorded) {

                      if (p.action ==
                              MotionEvent.ACTION_DOWN) {

                          first = p;
                          break;
                      }
                  }

                  if (first == null) {

                      if (finished != null) {
                          finished.run();
                      }

                      return;
                  }

                  for (int i = recorded.size() - 1;
                       i >= 0;
                       i--) {

                      GesturePoint p = recorded.get(i);

                      if (p.action ==
                              MotionEvent.ACTION_UP) {

                          last = p;
                          break;
                      }
                  }

                  if (last == null) {
                      last = recorded.get(
                              recorded.size() - 1
                      );
                  }

                  Path path = new Path();

                  path.moveTo(
                          first.x,
                          first.y
                  );

                  for (GesturePoint p : recorded) {

                      if (p.time < first.time) {
                          continue;
                      }

                      if (p.action ==
                              MotionEvent.ACTION_MOVE
                              || p.action ==
                              MotionEvent.ACTION_UP) {

                          path.lineTo(
                                  p.x,
                                  p.y
                          );
                      }
                  }

                  long duration =
                          last.time - first.time;

                  if (duration < 50) {
                      duration = 50;
                  }

                  if (duration > 60000) {
                      duration = 60000;
                  }

                  GestureDescription.StrokeDescription stroke =
                          new GestureDescription.StrokeDescription(
                                  path,
                                  0,
                                  duration
                          );

                  GestureDescription gesture =
                          new GestureDescription.Builder()
                                  .addStroke(stroke)
                                  .build();

                  dispatchGesture(
                          gesture,
                          new GestureResultCallback() {

                              @Override
                              public void onCompleted(
                                      GestureDescription gestureDescription) {

                                  if (finished != null) {
                                      finished.run();
                                  }
                              }

                              @Override
                              public void onCancelled(
                                      GestureDescription gestureDescription) {

                                  if (finished != null) {
                                      finished.run();
                                  }
                              }
                          },
                          handler
                  );
              }
          }
          EOF

          # ========================================================
          # MAIN ACTIVITY
          # ========================================================

          cat > app/src/main/java/com/example/gesturerecorder/MainActivity.java <<'EOF'
          package com.example.gesturerecorder;

          import android.accessibilityservice.AccessibilityService;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import androidx.appcompat.app.AppCompatActivity;

          import java.util.List;

          public class MainActivity
                  extends AppCompatActivity {

              private TextView status;
              private TextView count;

              private Button record;
              private Button stop;
              private Button replay;
              private Button clear;
              private Button settings;

              private boolean replaying = false;

              @Override
              protected void onCreate(
                      Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  createInterface();

                  record.setOnClickListener(
                          v -> startRecording()
                  );

                  stop.setOnClickListener(
                          v -> stopRecording()
                  );

                  replay.setOnClickListener(
                          v -> startReplay()
                  );

                  clear.setOnClickListener(
                          v -> {

                              GestureRecorder.clear();

                              status.setText(
                                      "Recording cleared"
                              );

                              refresh();
                          }
                  );

                  settings.setOnClickListener(
                          v -> openAccessibility()
                  );

                  refresh();
              }

              private void createInterface() {

                  ScrollView scroll =
                          new ScrollView(this);

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  root.setGravity(
                          Gravity.CENTER_HORIZONTAL
                  );

                  root.setPadding(
                          32,
                          40,
                          32,
                          40
                  );

                  TextView title =
                          new TextView(this);

                  title.setText(
                          "Gesture Recorder"
                  );

                  title.setTextSize(30);

                  title.setTextColor(
                          Color.WHITE
                  );

                  title.setGravity(
                          Gravity.CENTER
                  );

                  root.addView(
                          title,
                          fullWidth()
                  );

                  status =
                          new TextView(this);

                  status.setTextSize(20);

                  status.setGravity(
                          Gravity.CENTER
                  );

                  status.setPadding(
                          0,
                          30,
                          0,
                          10
                  );

                  root.addView(
                          status,
                          fullWidth()
                  );

                  count =
                          new TextView(this);

                  count.setTextSize(17);

                  count.setGravity(
                          Gravity.CENTER
                  );

                  root.addView(
                          count,
                          fullWidth()
                  );

                  record =
                          makeButton(
                                  "START RECORDING"
                          );

                  root.addView(record);

                  stop =
                          makeButton(
                                  "STOP RECORDING"
                          );

                  root.addView(stop);

                  replay =
                          makeButton(
                                  "REPLAY"
                          );

                  root.addView(replay);

                  clear =
                          makeButton(
                                  "CLEAR RECORDING"
                          );

                  root.addView(clear);

                  settings =
                          makeButton(
                                  "OPEN ACCESSIBILITY SETTINGS"
                          );

                  root.addView(settings);

                  TextView information =
                          new TextView(this);

                  information.setText(
                          "\nIMPORTANT\n\n"
                                  + "Enable Gesture Recorder in "
                                  + "Android Accessibility settings "
                                  + "before recording or replaying."
                                  + "\n\n"
                                  + "The service uses Android's "
                                  + "Accessibility gesture API."
                  );

                  information.setTextSize(15);

                  information.setPadding(
                          0,
                          30,
                          0,
                          0
                  );

                  root.addView(
                          information,
                          fullWidth()
                  );

                  scroll.addView(root);

                  setContentView(scroll);
              }

              private Button makeButton(
                      String text) {

                  Button b =
                          new Button(this);

                  b.setText(text);

                  b.setTextSize(16);

                  b.setAllCaps(false);

                  LinearLayout.LayoutParams lp =
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  LinearLayout.LayoutParams.WRAP_CONTENT
                          );

                  lp.setMargins(
                          0,
                          10,
                          0,
                          10
                  );

                  b.setLayoutParams(lp);

                  return b;
              }

              private LinearLayout.LayoutParams fullWidth() {

                  return new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                  );
              }

              private void startRecording() {

                  if (!isAccessibilityEnabled()) {

                      status.setText(
                              "Accessibility is OFF"
                      );

                      openAccessibility();

                      return;
                  }

                  replaying = false;

                  GestureRecorder.start();

                  status.setText(
                          "RECORDING"
                  );

                  refresh();
              }

              private void stopRecording() {

                  GestureRecorder.stop();

                  status.setText(
                          "RECORDING STOPPED"
                  );

                  refresh();
              }

              private void startReplay() {

                  if (!isAccessibilityEnabled()) {

                      status.setText(
                              "Accessibility is OFF"
                      );

                      openAccessibility();

                      return;
                  }

                  List<GesturePoint> data =
                          GestureRecorder.snapshot();

                  if (data.isEmpty()) {

                      status.setText(
                              "NOTHING TO REPLAY"
                      );

                      return;
                  }

                  GestureAccessibilityService service =
                          GestureAccessibilityService.instance;

                  if (service == null) {

                      status.setText(
                              "Accessibility service unavailable"
                      );

                      return;
                  }

                  replaying = true;

                  status.setText(
                          "REPLAYING..."
                  );

                  refresh();

                  service.replay(
                          data,
                          () -> runOnUiThread(() -> {

                              replaying = false;

                              status.setText(
                                      "REPLAY FINISHED"
                              );

                              refresh();
                          })
                  );
              }

              private boolean isAccessibilityEnabled() {

                  ComponentName expected =
                          new ComponentName(
                                  this,
                                  GestureAccessibilityService.class
                          );

                  String enabled =
                          Settings.Secure.getString(
                                  getContentResolver(),
                                  Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                          );

                  if (enabled == null) {
                      return false;
                  }

                  String[] services =
                          enabled.split(":");

                  for (String value : services) {

                      ComponentName component =
                              ComponentName.unflattenFromString(
                                      value
                              );

                      if (expected.equals(component)) {
                          return true;
                      }
                  }

                  return false;
              }

              private void openAccessibility() {

                  Intent intent =
                          new Intent(
                                  Settings.ACTION_ACCESSIBILITY_SETTINGS
                          );

                  startActivity(intent);
              }

              private void refresh() {

                  count.setText(
                          "Recorded events: "
                                  + GestureRecorder.size()
                  );

                  boolean enabled =
                          isAccessibilityEnabled();

                  if (GestureRecorder.isRecording()) {

                      record.setEnabled(false);
                      stop.setEnabled(true);
                      replay.setEnabled(false);
                      clear.setEnabled(false);

                  } else if (replaying) {

                      record.setEnabled(false);
                      stop.setEnabled(false);
                      replay.setEnabled(false);
                      clear.setEnabled(false);

                  } else {

                      record.setEnabled(enabled);
                      stop.setEnabled(false);

                      replay.setEnabled(
                              GestureRecorder.size() > 0
                                      && enabled
                      );

                      clear.setEnabled(
                              GestureRecorder.size() > 0
                      );
                  }
              }

              @Override
              protected void onResume() {

                  super.onResume();

                  if (status != null) {
                      refresh();
                  }
              }
          }
          EOF

          echo "Android Java project created."

      # ============================================================
      # INSTALL GRADLE
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # ============================================================
      # CREATE WRAPPER
      # ============================================================

      - name: Generate Gradle wrapper
        working-directory: GestureRecorder
        run: |
          gradle wrapper --gradle-version 8.10.2

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build debug APK
        working-directory: GestureRecorder
        run: |
          ./gradlew clean assembleDebug --stacktrace

      # ============================================================
      # VERIFY
      # ============================================================

      - name: Verify APK
        run: |
          set -e

          APK="GestureRecorder/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
              echo "APK was not created."
              find GestureRecorder/app/build -type f || true
              exit 1
          fi

          echo "APK successfully built:"
          ls -lh "$APK"

      # ============================================================
      # PREPARE ARTIFACT
      # ============================================================

      - name: Prepare APK
        run: |
          mkdir -p output

          cp \
            GestureRecorder/app/build/outputs/apk/debug/app-debug.apk \
            output/GestureRecorder-Android16-Java.apk

          ls -lh output/GestureRecorder-Android16-Java.apk

      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GestureRecorder-Android16-Java
          path: output/GestureRecorder-Android16-Java.apk
          if-no-files-found: error
          retention-days: 14
