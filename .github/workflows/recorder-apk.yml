name: Build Gesture Recorder - Java Android 16

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CREATE PROJECT
      # ============================================================

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p GestureRecorder/app/src/main/java/com/example/gesturerecorder
          mkdir -p GestureRecorder/app/src/main/res/xml
          mkdir -p GestureRecorder/app/src/main/res/values

          cd GestureRecorder

          # --------------------------------------------------------
          # settings.gradle
          # --------------------------------------------------------

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "GestureRecorder"
          include(":app")
          EOF

          # --------------------------------------------------------
          # Root build.gradle
          # --------------------------------------------------------

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          # --------------------------------------------------------
          # gradle.properties
          # --------------------------------------------------------

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          # --------------------------------------------------------
          # App build.gradle
          # NO ANDROIDX
          # NO KOTLIN
          # --------------------------------------------------------

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.gesturerecorder'

              compileSdk 36

              defaultConfig {
                  applicationId 'com.example.gesturerecorder'

                  minSdk 26

                  targetSdk 36

                  versionCode 1

                  versionName '1.0'
              }

              buildTypes {

                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              // Intentionally empty.
              //
              // This project uses ONLY Android framework APIs.
              // No AndroidX.
              // No Kotlin.
              // No external libraries.
          }
          EOF

          # ========================================================
          # STRINGS
          # ========================================================

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <string name="app_name">
                  Gesture Recorder
              </string>

              <string name="accessibility_description">
                  Records touch gestures and replays recorded gestures.
              </string>

          </resources>
          EOF

          # ========================================================
          # ACCESSIBILITY SERVICE CONFIG
          # ========================================================

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"

              android:description="@string/accessibility_description"

              android:accessibilityEventTypes="typeAllMask"

              android:accessibilityFeedbackType="feedbackGeneric"

              android:notificationTimeout="50"

              android:canRetrieveWindowContent="false"

              android:canPerformGestures="true"

              android:canRequestTouchExplorationMode="true"

              android:accessibilityFlags="flagDefault|flagRequestTouchExplorationMode" />

          EOF

          # ========================================================
          # MANIFEST
          # ========================================================

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

                  <service
                      android:name=".GestureAccessibilityService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">

                      <intent-filter>

                          <action
                              android:name="android.accessibilityservice.AccessibilityService" />

                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />

                  </service>

              </application>

          </manifest>
          EOF

          # ========================================================
          # GESTURE POINT
          # ========================================================

          cat > app/src/main/java/com/example/gesturerecorder/GesturePoint.java <<'EOF'
          package com.example.gesturerecorder;

          public class GesturePoint {

              public final int action;

              public final float x;

              public final float y;

              public final long time;

              public GesturePoint(
                      int action,
                      float x,
                      float y,
                      long time) {

                  this.action = action;

                  this.x = x;

                  this.y = y;

                  this.time = time;
              }
          }
          EOF

          # ========================================================
          # GESTURE RECORDER
          # ========================================================

          cat > app/src/main/java/com/example/gesturerecorder/GestureRecorder.java <<'EOF'
          package com.example.gesturerecorder;

          import android.view.MotionEvent;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;

          public final class GestureRecorder {

              private static final List<GesturePoint> points =
                      Collections.synchronizedList(
                              new ArrayList<GesturePoint>()
                      );

              private static volatile boolean recording = false;

              private GestureRecorder() {
              }

              public static synchronized void start() {

                  points.clear();

                  recording = true;
              }

              public static synchronized void stop() {

                  recording = false;
              }

              public static synchronized void clear() {

                  recording = false;

                  points.clear();
              }

              public static boolean isRecording() {

                  return recording;
              }

              public static synchronized void add(
                      MotionEvent event) {

                  if (!recording) {
                      return;
                  }

                  int action =
                          event.getActionMasked();

                  if (action != MotionEvent.ACTION_DOWN
                          && action != MotionEvent.ACTION_MOVE
                          && action != MotionEvent.ACTION_UP) {

                      return;
                  }

                  points.add(
                          new GesturePoint(
                                  action,
                                  event.getRawX(),
                                  event.getRawY(),
                                  event.getEventTime()
                          )
                  );
              }

              public static synchronized int count() {

                  return points.size();
              }

              public static synchronized List<GesturePoint>
              snapshot() {

                  return new ArrayList<>(
                          points
                  );
              }
          }
          EOF

          # ========================================================
          # ACCESSIBILITY SERVICE
          # ========================================================

          cat > app/src/main/java/com/example/gesturerecorder/GestureAccessibilityService.java <<'EOF'
          package com.example.gesturerecorder;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.AccessibilityServiceInfo;
          import android.accessibilityservice.GestureDescription;
          import android.graphics.Path;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.InputDevice;
          import android.view.MotionEvent;
          import android.view.accessibility.AccessibilityEvent;

          import java.util.List;

          public class GestureAccessibilityService
                  extends AccessibilityService {

              public static volatile
              GestureAccessibilityService instance;

              private final Handler handler =
                      new Handler(
                              Looper.getMainLooper()
                      );

              @Override
              protected void onServiceConnected() {

                  super.onServiceConnected();

                  instance = this;

                  AccessibilityServiceInfo info =
                          getServiceInfo();

                  if (info == null) {

                      info =
                              new AccessibilityServiceInfo();
                  }

                  info.eventTypes =
                          AccessibilityEvent.TYPE_ALL_MASK;

                  info.feedbackType =
                          AccessibilityServiceInfo.FEEDBACK_GENERIC;

                  info.flags =
                          AccessibilityServiceInfo
                                  .FLAG_DEFAULT
                                  |
                          AccessibilityServiceInfo
                                  .FLAG_REQUEST_TOUCH_EXPLORATION_MODE;

                  /*
                   * Android 14+ supports requesting touchscreen
                   * MotionEvents directly.
                   */
                  if (Build.VERSION.SDK_INT >= 34) {

                      info.setMotionEventSources(
                              InputDevice.SOURCE_TOUCHSCREEN
                      );
                  }

                  setServiceInfo(info);
              }

              @Override
              public void onMotionEvent(
                      MotionEvent event) {

                  if (event == null) {
                      return;
                  }

                  if ((event.getSource()
                          & InputDevice.SOURCE_TOUCHSCREEN)
                          == 0) {

                      return;
                  }

                  GestureRecorder.add(event);
              }

              @Override
              public void onAccessibilityEvent(
                      AccessibilityEvent event) {

                  // Not required for gesture recording.
              }

              @Override
              public void onInterrupt() {
              }

              @Override
              public void onDestroy() {

                  instance = null;

                  super.onDestroy();
              }

              public void replay(
                      List<GesturePoint> data,
                      Runnable finished) {

                  if (data == null
                          || data.isEmpty()) {

                      if (finished != null) {
                          finished.run();
                      }

                      return;
                  }

                  GesturePoint first = null;

                  GesturePoint last = null;

                  for (GesturePoint point : data) {

                      if (point.action
                              == MotionEvent.ACTION_DOWN) {

                          first = point;

                          break;
                      }
                  }

                  if (first == null) {

                      if (finished != null) {
                          finished.run();
                      }

                      return;
                  }

                  for (int i = data.size() - 1;
                       i >= 0;
                       i--) {

                      GesturePoint point =
                              data.get(i);

                      if (point.action
                              == MotionEvent.ACTION_UP) {

                          last = point;

                          break;
                      }
                  }

                  if (last == null) {

                      last =
                              data.get(
                                      data.size() - 1
                              );
                  }

                  Path path =
                          new Path();

                  path.moveTo(
                          first.x,
                          first.y
                  );

                  for (GesturePoint point : data) {

                      if (point.time
                              < first.time) {

                          continue;
                      }

                      if (point.action
                              == MotionEvent.ACTION_MOVE
                              ||
                          point.action
                              == MotionEvent.ACTION_UP) {

                          path.lineTo(
                                  point.x,
                                  point.y
                          );
                      }
                  }

                  long duration =
                          last.time - first.time;

                  if (duration < 50) {

                      duration = 50;
                  }

                  if (duration > 60000) {

                      duration = 60000;
                  }

                  GestureDescription.StrokeDescription
                          stroke =
                          new GestureDescription
                                  .StrokeDescription(
                                          path,
                                          0,
                                          duration
                                  );

                  GestureDescription gesture =
                          new GestureDescription
                                  .Builder()
                                  .addStroke(stroke)
                                  .build();

                  dispatchGesture(
                          gesture,
                          new GestureResultCallback() {

                              @Override
                              public void onCompleted(
                                      GestureDescription description) {

                                  if (finished != null) {
                                      finished.run();
                                  }
                              }

                              @Override
                              public void onCancelled(
                                      GestureDescription description) {

                                  if (finished != null) {
                                      finished.run();
                                  }
                              }
                          },
                          handler
                  );
              }
          }
          EOF

          # ========================================================
          # MAIN ACTIVITY
          # ========================================================

          cat > app/src/main/java/com/example/gesturerecorder/MainActivity.java <<'EOF'
          package com.example.gesturerecorder;

          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.util.List;

          public class MainActivity
                  extends Activity {

              private TextView status;

              private TextView count;

              private Button record;

              private Button stop;

              private Button replay;

              private Button clear;

              private Button settings;

              private boolean replaying = false;

              @Override
              protected void onCreate(
                      Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  buildScreen();

                  record.setOnClickListener(
                          v -> startRecording()
                  );

                  stop.setOnClickListener(
                          v -> stopRecording()
                  );

                  replay.setOnClickListener(
                          v -> startReplay()
                  );

                  clear.setOnClickListener(
                          v -> {

                              GestureRecorder.clear();

                              status.setText(
                                      "Recording cleared"
                              );

                              refresh();
                          }
                  );

                  settings.setOnClickListener(
                          v -> openSettings()
                  );

                  refresh();
              }

              private void buildScreen() {

                  ScrollView scroll =
                          new ScrollView(this);

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  root.setGravity(
                          Gravity.CENTER_HORIZONTAL
                  );

                  root.setPadding(
                          30,
                          40,
                          30,
                          40
                  );

                  TextView title =
                          new TextView(this);

                  title.setText(
                          "Gesture Recorder"
                  );

                  title.setTextSize(30);

                  title.setGravity(
                          Gravity.CENTER
                  );

                  root.addView(
                          title,
                          fullWidth()
                  );

                  status =
                          new TextView(this);

                  status.setTextSize(20);

                  status.setGravity(
                          Gravity.CENTER
                  );

                  status.setPadding(
                          0,
                          30,
                          0,
                          15
                  );

                  root.addView(
                          status,
                          fullWidth()
                  );

                  count =
                          new TextView(this);

                  count.setTextSize(17);

                  count.setGravity(
                          Gravity.CENTER
                  );

                  root.addView(
                          count,
                          fullWidth()
                  );

                  record =
                          button(
                                  "START RECORDING"
                          );

                  root.addView(record);

                  stop =
                          button(
                                  "STOP RECORDING"
                          );

                  root.addView(stop);

                  replay =
                          button(
                                  "REPLAY"
                          );

                  root.addView(replay);

                  clear =
                          button(
                                  "CLEAR RECORDING"
                          );

                  root.addView(clear);

                  settings =
                          button(
                                  "OPEN ACCESSIBILITY SETTINGS"
                          );

                  root.addView(settings);

                  TextView info =
                          new TextView(this);

                  info.setText(
                          "\nEnable Gesture Recorder "
                                  + "in Accessibility settings "
                                  + "before recording."
                  );

                  info.setTextSize(16);

                  info.setPadding(
                          0,
                          30,
                          0,
                          0
                  );

                  root.addView(
                          info,
                          fullWidth()
                  );

                  scroll.addView(root);

                  setContentView(scroll);
              }

              private Button button(
                      String text) {

                  Button b =
                          new Button(this);

                  b.setText(text);

                  b.setTextSize(16);

                  LinearLayout.LayoutParams lp =
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT
                          );

                  lp.setMargins(
                          0,
                          8,
                          0,
                          8
                  );

                  b.setLayoutParams(lp);

                  return b;
              }

              private LinearLayout.LayoutParams
              fullWidth() {

                  return new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                  );
              }

              private void startRecording() {

                  if (!isAccessibilityEnabled()) {

                      status.setText(
                              "Accessibility is OFF"
                      );

                      openSettings();

                      return;
                  }

                  replaying = false;

                  GestureRecorder.start();

                  status.setText(
                          "RECORDING"
                  );

                  refresh();
              }

              private void stopRecording() {

                  GestureRecorder.stop();

                  status.setText(
                          "RECORDING STOPPED"
                  );

                  refresh();
              }

              private void startReplay() {

                  if (!isAccessibilityEnabled()) {

                      status.setText(
                              "Accessibility is OFF"
                      );

                      openSettings();

                      return;
                  }

                  List<GesturePoint> data =
                          GestureRecorder.snapshot();

                  if (data.isEmpty()) {

                      status.setText(
                              "NOTHING RECORDED"
                      );

                      return;
                  }

                  GestureAccessibilityService service =
                          GestureAccessibilityService
                                  .instance;

                  if (service == null) {

                      status.setText(
                              "SERVICE UNAVAILABLE"
                      );

                      return;
                  }

                  replaying = true;

                  status.setText(
                          "REPLAYING..."
                  );

                  refresh();

                  service.replay(
                          data,
                          () ->
                                  runOnUiThread(
                                          () -> {

                                              replaying =
                                                      false;

                                              status.setText(
                                                      "REPLAY FINISHED"
                                              );

                                              refresh();
                                          }
                                  )
                  );
              }

              private boolean
              isAccessibilityEnabled() {

                  ComponentName expected =
                          new ComponentName(
                                  this,
                                  GestureAccessibilityService.class
                          );

                  String enabled =
                          Settings.Secure.getString(
                                  getContentResolver(),
                                  Settings.Secure
                                          .ENABLED_ACCESSIBILITY_SERVICES
                          );

                  if (enabled == null) {

                      return false;
                  }

                  for (String value :
                          enabled.split(":")) {

                      ComponentName component =
                              ComponentName
                                      .unflattenFromString(
                                              value
                                      );

                      if (expected.equals(component)) {

                          return true;
                      }
                  }

                  return false;
              }

              private void openSettings() {

                  startActivity(
                          new Intent(
                                  Settings
                                          .ACTION_ACCESSIBILITY_SETTINGS
                          )
                  );
              }

              private void refresh() {

                  count.setText(
                          "Recorded events: "
                                  + GestureRecorder.count()
                  );

                  boolean enabled =
                          isAccessibilityEnabled();

                  if (GestureRecorder
                          .isRecording()) {

                      record.setEnabled(false);

                      stop.setEnabled(true);

                      replay.setEnabled(false);

                      clear.setEnabled(false);

                  } else if (replaying) {

                      record.setEnabled(false);

                      stop.setEnabled(false);

                      replay.setEnabled(false);

                      clear.setEnabled(false);

                  } else {

                      record.setEnabled(
                              enabled
                      );

                      stop.setEnabled(false);

                      replay.setEnabled(
                              enabled
                                      &&
                              GestureRecorder
                                      .count() > 0
                      );

                      clear.setEnabled(
                              GestureRecorder
                                      .count() > 0
                      );
                  }
              }

              @Override
              protected void onResume() {

                  super.onResume();

                  if (status != null) {

                      refresh();
                  }
              }
          }
          EOF

          echo "Project created successfully."

      # ============================================================
      # GRADLE
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Generate Gradle wrapper
        working-directory: GestureRecorder
        run: |
          gradle wrapper --gradle-version 8.10.2

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build debug APK
        working-directory: GestureRecorder
        run: |
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      # ============================================================
      # VERIFY
      # ============================================================

      - name: Verify APK
        run: |
          set -e

          APK="GestureRecorder/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
              echo "ERROR: APK was not created."
              find GestureRecorder/app/build -type f || true
              exit 1
          fi

          echo ""
          echo "========================================"
          echo "APK BUILD SUCCESSFUL"
          echo "========================================"
          ls -lh "$APK"

      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Prepare APK artifact
        run: |
          mkdir -p output

          cp \
            GestureRecorder/app/build/outputs/apk/debug/app-debug.apk \
            output/GestureRecorder-Android16.apk

          ls -lh output/GestureRecorder-Android16.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GestureRecorder-Android16
          path: output/GestureRecorder-Android16.apk
          if-no-files-found: error
          retention-days: 14
