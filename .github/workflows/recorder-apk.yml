name: Build Gesture Recorder - Android 16 Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android 16 Test APK
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Get repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Java 17
      # ---------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------
      # 3. Android SDK
      # ---------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ---------------------------------------------------------
      # 4. Install Gradle
      # ---------------------------------------------------------
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      # ---------------------------------------------------------
      # 5. Create project
      # ---------------------------------------------------------
      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p gesture-recorder/app/src/main/java/com/gesture/recorder
          mkdir -p gesture-recorder/app/src/main/res/xml
          mkdir -p gesture-recorder/app/src/main/res/values

          cat > gesture-recorder/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "GestureRecorder"
          include(":app")
          EOF

          cat > gesture-recorder/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gesture-recorder/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat > gesture-recorder/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.gesture.recorder'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.gesture.recorder'
                  minSdk 26
                  targetSdk 35
                  versionCode 2
                  versionName '1.1'
              }

              buildTypes {
                  debug {
                      debuggable true
                      minifyEnabled false
                      shrinkResources false
                  }

                  release {
                      debuggable false
                      minifyEnabled false
                      shrinkResources false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > gesture-recorder/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".GestureAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">

                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />

                  </service>

              </application>

          </manifest>
          EOF

          cat > gesture-recorder/app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:description="@string/accessibility_description" />
          EOF

          cat > gesture-recorder/app/src/main/res/values/strings.xml <<'EOF'
          <resources>

              <string name="app_name">Gesture Recorder</string>

              <string name="accessibility_description">
                  Gesture Recorder uses Android Accessibility Service to control gestures for user-authorized recording and replay.
              </string>

          </resources>
          EOF

          cat > gesture-recorder/app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>

              </style>

          </resources>
          EOF

      # ---------------------------------------------------------
      # 6. Main application
      # ---------------------------------------------------------
      - name: Create MainActivity
        shell: bash
        run: |
          cat > gesture-recorder/app/src/main/java/com/gesture/recorder/MainActivity.java <<'EOF'
          package com.gesture.recorder;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private TextView status;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(40, 40, 40, 40);
                  layout.setGravity(Gravity.CENTER_HORIZONTAL);

                  TextView title = new TextView(this);
                  title.setText("Gesture Recorder");
                  title.setTextSize(28);
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(0, 0, 0, 20);

                  layout.addView(title);

                  TextView info = new TextView(this);
                  info.setText(
                      "Android 16 test build\\n\\n" +
                      "First enable the Accessibility Service.\\n" +
                      "Then recording and replay controls can be tested."
                  );
                  info.setTextSize(16);
                  info.setGravity(Gravity.CENTER);
                  info.setPadding(0, 0, 0, 25);

                  layout.addView(info);

                  status = new TextView(this);
                  status.setText("Status: Ready");
                  status.setTextSize(18);
                  status.setGravity(Gravity.CENTER);
                  status.setPadding(0, 0, 0, 20);

                  layout.addView(status);

                  Button accessibility = new Button(this);
                  accessibility.setText(
                      "Enable Accessibility Service"
                  );

                  accessibility.setOnClickListener(v -> {
                      try {
                          Intent intent = new Intent(
                              Settings.ACTION_ACCESSIBILITY_SETTINGS
                          );

                          startActivity(intent);

                      } catch (Exception e) {

                          Toast.makeText(
                              this,
                              "Unable to open Accessibility Settings",
                              Toast.LENGTH_LONG
                          ).show();
                      }
                  });

                  layout.addView(accessibility);

                  Button start = new Button(this);
                  start.setText("START RECORDING");

                  start.setOnClickListener(v -> {
                      GestureAccessibilityService.startRecording();
                      status.setText("Status: Recording");
                  });

                  layout.addView(start);

                  Button stop = new Button(this);
                  stop.setText("STOP RECORDING");

                  stop.setOnClickListener(v -> {
                      GestureAccessibilityService.stopRecording();
                      status.setText("Status: Stopped");
                  });

                  layout.addView(stop);

                  Button replay = new Button(this);
                  replay.setText("REPLAY");

                  replay.setOnClickListener(v -> {
                      GestureAccessibilityService.replayGesture();
                      status.setText("Status: Replay requested");
                  });

                  layout.addView(replay);

                  Button clear = new Button(this);
                  clear.setText("CLEAR RECORDING");

                  clear.setOnClickListener(v -> {
                      GestureAccessibilityService.clearRecording();
                      status.setText("Status: Recording cleared");
                  });

                  layout.addView(clear);

                  setContentView(layout);
              }
          }
          EOF

      # ---------------------------------------------------------
      # 7. Accessibility Service
      # ---------------------------------------------------------
      - name: Create Accessibility Service
        shell: bash
        run: |
          cat > gesture-recorder/app/src/main/java/com/gesture/recorder/GestureAccessibilityService.java <<'EOF'
          package com.gesture.recorder;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.graphics.Path;
          import android.os.Build;
          import android.view.accessibility.AccessibilityEvent;

          public class GestureAccessibilityService
                  extends AccessibilityService {

              private static GestureAccessibilityService instance;

              private static boolean recording = false;

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
              }

              @Override
              public void onAccessibilityEvent(
                      AccessibilityEvent event) {

                  if (!recording) {
                      return;
                  }

                  // Recording engine will be added in the next build.
              }

              @Override
              public void onInterrupt() {
              }

              @Override
              public void onDestroy() {
                  instance = null;
                  recording = false;
                  super.onDestroy();
              }

              public static void startRecording() {
                  recording = true;
              }

              public static void stopRecording() {
                  recording = false;
              }

              public static void clearRecording() {
                  recording = false;
              }

              public static void replayGesture() {

                  if (instance == null) {
                      return;
                  }

                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.N) {
                      return;
                  }

                  Path path = new Path();

                  path.moveTo(500, 500);
                  path.lineTo(700, 500);

                  GestureDescription.StrokeDescription stroke =
                      new GestureDescription.StrokeDescription(
                          path,
                          0,
                          500
                      );

                  GestureDescription gesture =
                      new GestureDescription.Builder()
                          .addStroke(stroke)
                          .build();

                  instance.dispatchGesture(
                      gesture,
                      null,
                      null
                  );
              }
          }
          EOF

      # ---------------------------------------------------------
      # 8. Build DEBUG APK
      # ---------------------------------------------------------
      - name: Build Android 16 test APK
        working-directory: gesture-recorder
        run: |
          set -e

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      # ---------------------------------------------------------
      # 9. Verify APK
      # ---------------------------------------------------------
      - name: Verify APK
        run: |
          set -e

          APK="gesture-recorder/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK successfully created:"
          ls -lh "$APK"

          echo "APK information:"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -20

      # ---------------------------------------------------------
      # 10. Rename APK
      # ---------------------------------------------------------
      - name: Prepare APK
        run: |
          set -e

          mkdir -p output

          cp \
            gesture-recorder/app/build/outputs/apk/debug/app-debug.apk \
            output/Gesture-Recorder-Android16-Test.apk

          ls -lh output/Gesture-Recorder-Android16-Test.apk

      # ---------------------------------------------------------
      # 11. Upload artifact
      # ---------------------------------------------------------
      - name: Upload Android 16 test APK
        uses: actions/upload-artifact@v4
        with:
          name: Gesture-Recorder-Android16-Test
          path: output/Gesture-Recorder-Android16-Test.apk
          if-no-files-found: error
          retention-days: 30
