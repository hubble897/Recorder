name: Build Gesture Recorder APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Download the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Create the Android project
      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p gesture-recorder/app/src/main/java/com/gesture/recorder
          mkdir -p gesture-recorder/app/src/main/res/xml
          mkdir -p gesture-recorder/app/src/main/res/values

          cat > gesture-recorder/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "GestureRecorder"
          include(":app")
          EOF

          cat > gesture-recorder/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gesture-recorder/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > gesture-recorder/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.gesture.recorder'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.gesture.recorder'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  debug {
                      debuggable true
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > gesture-recorder/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".GestureAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />

                  </service>

              </application>

          </manifest>
          EOF

          cat > gesture-recorder/app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:description="@string/accessibility_description"
              android:settingsActivity="com.gesture.recorder.MainActivity" />
          EOF

          cat > gesture-recorder/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Gesture Recorder</string>
              <string name="accessibility_description">Gesture Recorder records and replays touch gestures.</string>
          </resources>
          EOF

          cat > gesture-recorder/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#3F51B5</item>
              </style>
          </resources>
          EOF

      # 4. Create Main Activity
      - name: Create MainActivity
        shell: bash
        run: |
          cat > gesture-recorder/app/src/main/java/com/gesture/recorder/MainActivity.java <<'EOF'
          package com.gesture.recorder;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              private TextView status;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(40, 40, 40, 40);

                  TextView title = new TextView(this);
                  title.setText("Gesture Recorder");
                  title.setTextSize(28);
                  title.setPadding(0, 0, 0, 30);

                  status = new TextView(this);
                  status.setText("Ready");
                  status.setTextSize(18);
                  status.setPadding(0, 20, 0, 30);

                  Button accessibility = new Button(this);
                  accessibility.setText("Enable Accessibility Service");

                  Button record = new Button(this);
                  record.setText("Start Recording");

                  Button stop = new Button(this);
                  stop.setText("Stop Recording");

                  Button replay = new Button(this);
                  replay.setText("Replay Gesture");

                  Button clear = new Button(this);
                  clear.setText("Clear Recording");

                  layout.addView(title);
                  layout.addView(status);
                  layout.addView(accessibility);
                  layout.addView(record);
                  layout.addView(stop);
                  layout.addView(replay);
                  layout.addView(clear);

                  setContentView(layout);

                  accessibility.setOnClickListener(v -> {
                      try {
                          Intent intent = new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS);
                          startActivity(intent);
                      } catch (Exception e) {
                          status.setText("Unable to open Accessibility Settings");
                      }
                  });

                  record.setOnClickListener(v -> {
                      GestureAccessibilityService.startRecording();
                      status.setText("Recording...");
                  });

                  stop.setOnClickListener(v -> {
                      GestureAccessibilityService.stopRecording();
                      status.setText("Recording stopped");
                  });

                  replay.setOnClickListener(v -> {
                      GestureAccessibilityService.replayGesture();
                      status.setText("Replaying gesture...");
                  });

                  clear.setOnClickListener(v -> {
                      GestureAccessibilityService.clearRecording();
                      status.setText("Recording cleared");
                  });
              }
          }
          EOF

      # 5. Create Accessibility Service
      - name: Create GestureAccessibilityService
        shell: bash
        run: |
          cat > gesture-recorder/app/src/main/java/com/gesture/recorder/GestureAccessibilityService.java <<'EOF'
          package com.gesture.recorder;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.graphics.Path;
          import android.os.Build;
          import android.view.MotionEvent;
          import android.view.accessibility.AccessibilityEvent;

          import java.util.ArrayList;
          import java.util.List;

          public class GestureAccessibilityService extends AccessibilityService {

              private static GestureAccessibilityService instance;

              private static boolean recording = false;

              private static final List<TouchPoint> points = new ArrayList<>();

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
              }

              @Override
              public boolean onUnbind(android.content.Intent intent) {
                  if (instance == this) {
                      instance = null;
                  }
                  return super.onUnbind(intent);
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
              }

              @Override
              public void onInterrupt() {
              }

              @Override
              public boolean onMotionEvent(MotionEvent event) {

                  if (recording) {

                      int action = event.getActionMasked();

                      if (action == MotionEvent.ACTION_DOWN ||
                          action == MotionEvent.ACTION_MOVE ||
                          action == MotionEvent.ACTION_UP) {

                          points.add(new TouchPoint(
                                  event.getX(),
                                  event.getY(),
                                  System.currentTimeMillis(),
                                  action
                          ));
                      }
                  }

                  return super.onMotionEvent(event);
              }

              public static void startRecording() {
                  points.clear();
                  recording = true;
              }

              public static void stopRecording() {
                  recording = false;
              }

              public static void clearRecording() {
                  recording = false;
                  points.clear();
              }

              public static void replayGesture() {

                  if (instance == null || points.size() < 2) {
                      return;
                  }

                  Path path = new Path();

                  TouchPoint first = points.get(0);
                  path.moveTo(first.x, first.y);

                  for (int i = 1; i < points.size(); i++) {
                      TouchPoint point = points.get(i);
                      path.lineTo(point.x, point.y);
                  }

                  long duration = 500;

                  if (points.size() > 1) {
                      long calculated =
                              points.get(points.size() - 1).time -
                              points.get(0).time;

                      if (calculated > 50 && calculated < 10000) {
                          duration = calculated;
                      }
                  }

                  GestureDescription.StrokeDescription stroke =
                          new GestureDescription.StrokeDescription(
                                  path,
                                  0,
                                  duration
                          );

                  GestureDescription gesture =
                          new GestureDescription.Builder()
                                  .addStroke(stroke)
                                  .build();

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                      instance.dispatchGesture(
                              gesture,
                              null,
                              null
                      );
                  }
              }

              private static class TouchPoint {

                  float x;
                  float y;
                  long time;
                  int action;

                  TouchPoint(float x, float y, long time, int action) {
                      this.x = x;
                      this.y = y;
                      this.time = time;
                      this.action = action;
                  }
              }
          }
          EOF

      # 6. Download Gradle
      - name: Install Gradle
        shell: bash
        run: |
          cd gesture-recorder
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          rm gradle-8.9-bin.zip
          mv gradle-8.9 gradle-dist

      # 7. Build APK
      - name: Build APK
        shell: bash
        run: |
          cd gesture-recorder
          ./gradle-dist/bin/gradle clean assembleDebug --stacktrace

      # 8. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          APK="gesture-recorder/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK successfully created."
          echo "APK size:"
          ls -lh "$APK"

          echo "APK files:"
          unzip -l "$APK" | head -40

      # 9. Upload APK
      - name: Upload Gesture Recorder APK
        uses: actions/upload-artifact@v4
        with:
          name: Gesture-Recorder-APK
          path: gesture-recorder/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
