name: Recorder APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Show repository
        run: |
          echo "=== Repository files ==="
          find . -maxdepth 5 -type f | sort

      - name: Find Gradle
        shell: bash
        run: |
          GRADLEW=$(find . -type f -name gradlew -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found."
            echo "The Android/Gradle project is missing from the repository."
            exit 1
          fi

          echo "Found: $GRADLEW"

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Make Gradle executable
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "=== APK files ==="
          find . -type f -name "*.apk" -print

          if ! find . -type f -name "*.apk" | grep -q .; then
            echo "ERROR: No APK was created."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Recorder-APK
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
