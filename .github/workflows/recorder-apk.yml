name: Build Gesture Recorder Android 16

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # JAVA 17
      # ==========================================================

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================================
      # CREATE COMPLETE ANDROID PROJECT
      # ==========================================================

      - name: Create Android project
        shell: bash
        run: |

          set -e

          rm -rf GestureRecorder

          mkdir -p GestureRecorder/app/src/main/java/com/gesture/recorder
          mkdir -p GestureRecorder/app/src/main/res/xml
          mkdir -p GestureRecorder/app/src/main/res/values


          # ======================================================
          # SETTINGS
          # ======================================================

          cat > GestureRecorder/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "GestureRecorder"

          include(":app")
          EOF


          # ======================================================
          # ROOT BUILD
          # ======================================================

          cat > GestureRecorder/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF


          # ======================================================
          # GRADLE PROPERTIES
          # ======================================================

          cat > GestureRecorder/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF


          # ======================================================
          # APP BUILD
          # ======================================================

          cat > GestureRecorder/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.gesture.recorder'

              compileSdk 36

              defaultConfig {
                  applicationId 'com.gesture.recorder'
                  minSdk 26
                  targetSdk 36
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                      debuggable true
                  }

                  release {
                      minifyEnabled false
                      shrinkResources false
                      debuggable false
                  }
              }
          }

          dependencies {
              // Android SDK only.
              // No Kotlin.
              // No AndroidX.
              // No external libraries.
          }
          EOF


          # ======================================================
          # STRINGS
          # ======================================================

          cat > GestureRecorder/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <string name="app_name">Gesture Recorder</string>

              <string name="accessibility_description">
                  Gesture Recorder accessibility service
              </string>

          </resources>
          EOF


          # ======================================================
          # ACCESSIBILITY SERVICE CONFIG
          # ======================================================

          cat > GestureRecorder/app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"

              android:description="@string/accessibility_description"

              android:accessibilityEventTypes="typeAllMask"

              android:accessibilityFeedbackType="feedbackGeneric"

              android:notificationTimeout="50"

              android:canRetrieveWindowContent="false"

              android:canPerformGestures="true"

              android:canRequestTouchExplorationMode="true"

              android:accessibilityFlags="flagDefault|flagRequestTouchExplorationMode" />

          EOF


          # ======================================================
          # MANIFEST
          # ======================================================

          cat > GestureRecorder/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>


                  <service
                      android:name=".GestureAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.accessibilityservice.AccessibilityService" />

                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />

                  </service>

              </application>

          </manifest>
          EOF


          # ======================================================
          # GESTURE POINT
          # ======================================================

          cat > GestureRecorder/app/src/main/java/com/gesture/recorder/GesturePoint.java <<'EOF'
          package com.gesture.recorder;

          public final class GesturePoint {

              public final float x;
              public final float y;
              public final long time;

              public GesturePoint(
                      float x,
                      float y,
                      long time) {

                  this.x = x;
                  this.y = y;
                  this.time = time;
              }
          }
          EOF


          # ======================================================
          # GESTURE RECORDER
          # ======================================================

          cat > GestureRecorder/app/src/main/java/com/gesture/recorder/GestureRecorder.java <<'EOF'
          package com.gesture.recorder;

          import android.view.MotionEvent;

          import java.util.ArrayList;
          import java.util.List;

          public final class GestureRecorder {

              private static final Object LOCK =
                      new Object();

              private static final ArrayList<GesturePoint> points =
                      new ArrayList<>();

              private static boolean recording = false;

              private static long firstEventTime = 0L;


              private GestureRecorder() {
              }


              public static void start() {

                  synchronized (LOCK) {

                      points.clear();

                      firstEventTime = 0L;

                      recording = true;
                  }
              }


              public static void stop() {

                  synchronized (LOCK) {

                      recording = false;
                  }
              }


              public static void clear() {

                  synchronized (LOCK) {

                      points.clear();

                      firstEventTime = 0L;

                      recording = false;
                  }
              }


              public static boolean isRecording() {

                  synchronized (LOCK) {

                      return recording;
                  }
              }


              public static void add(
                      MotionEvent event) {

                  if (event == null) {
                      return;
                  }

                  synchronized (LOCK) {

                      if (!recording) {
                          return;
                      }


                      long eventTime =
                              event.getEventTime();


                      if (firstEventTime == 0L) {

                          firstEventTime =
                                  eventTime;
                      }


                      long relativeTime =
                              eventTime - firstEventTime;


                      int count =
                              event.getPointerCount();


                      if (count <= 0) {
                          return;
                      }


                      /*
                       * Record the primary touch pointer.
                       */

                      float x =
                              event.getX(0);

                      float y =
                              event.getY(0);


                      points.add(
                              new GesturePoint(
                                      x,
                                      y,
                                      relativeTime
                              )
                      );
                  }
              }


              public static List<GesturePoint>
              getPoints() {

                  synchronized (LOCK) {

                      return new ArrayList<>(points);
                  }
              }


              public static int size() {

                  synchronized (LOCK) {

                      return points.size();
                  }
              }
          }
          EOF


          # ======================================================
          # ACCESSIBILITY SERVICE
          # ======================================================

          cat > GestureRecorder/app/src/main/java/com/gesture/recorder/GestureAccessibilityService.java <<'EOF'
          package com.gesture.recorder;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.AccessibilityServiceInfo;
          import android.accessibilityservice.GestureDescription;
          import android.accessibilityservice.TouchInteractionController;
          import android.graphics.Path;
          import android.os.Build;
          import android.view.Display;
          import android.view.MotionEvent;

          import java.util.List;
          import java.util.concurrent.Executor;

          public class GestureAccessibilityService
                  extends AccessibilityService {


              private static GestureAccessibilityService instance;


              private TouchInteractionController controller;


              /*
               * Keep the exact callback object so it can
               * be unregistered correctly.
               */

              private TouchInteractionController.Callback
                      touchCallback;


              public static GestureAccessibilityService
              getInstance() {

                  return instance;
              }


              @Override
              protected void onServiceConnected() {

                  super.onServiceConnected();

                  instance = this;


                  AccessibilityServiceInfo info =
                          getServiceInfo();


                  if (info == null) {

                      info =
                              new AccessibilityServiceInfo();
                  }


                  info.eventTypes = 0;


                  info.feedbackType =
                          AccessibilityServiceInfo.FEEDBACK_GENERIC;


                  info.notificationTimeout = 50;


                  /*
                   * TouchInteractionController requires
                   * touch exploration mode.
                   */

                  info.flags =
                          AccessibilityServiceInfo.FLAG_DEFAULT
                          | AccessibilityServiceInfo
                              .FLAG_REQUEST_TOUCH_EXPLORATION_MODE;


                  setServiceInfo(info);


                  /*
                   * TouchInteractionController was added
                   * in Android API 33.
                   *
                   * Android 16 is API 36.
                   */

                  if (Build.VERSION.SDK_INT >= 33) {

                      controller =
                              getTouchInteractionController(
                                      Display.DEFAULT_DISPLAY
                              );


                      touchCallback =
                              new TouchInteractionController.Callback() {

                                  @Override
                                  public void onMotionEvent(
                                          MotionEvent event) {

                                      if (event == null) {
                                          return;
                                      }


                                      GestureRecorder.add(
                                              event
                                      );
                                  }


                                  @Override
                                  public void onStateChanged(
                                          int state) {

                                      /*
                                       * Nothing required here.
                                       */
                                  }
                              };


                      Executor executor =
                              getMainExecutor();


                      controller.registerCallback(
                              executor,
                              touchCallback
                      );
                  }
              }


              public void replay() {

                  final List<GesturePoint> points =
                          GestureRecorder.getPoints();


                  if (points.isEmpty()) {

                      MainActivity.postStatus(
                              "Nothing recorded."
                      );

                      return;
                  }


                  GesturePoint first =
                          points.get(0);


                  GesturePoint last =
                          points.get(
                                  points.size() - 1
                          );


                  Path path =
                          new Path();


                  path.moveTo(
                          first.x,
                          first.y
                  );


                  for (int i = 1;
                       i < points.size();
                       i++) {

                      GesturePoint point =
                              points.get(i);


                      path.lineTo(
                              point.x,
                              point.y
                      );
                  }


                  long duration =
                          last.time - first.time;


                  if (duration < 100) {

                      duration = 100;
                  }


                  /*
                   * dispatchGesture has a practical
                   * duration limit for one stroke.
                   */

                  if (duration > 60000) {

                      duration = 60000;
                  }


                  GestureDescription.StrokeDescription stroke =
                          new GestureDescription.StrokeDescription(
                                  path,
                                  0,
                                  duration
                          );


                  GestureDescription gesture =
                          new GestureDescription.Builder()
                                  .addStroke(stroke)
                                  .build();


                  dispatchGesture(

                          gesture,

                          new GestureResultCallback() {

                              @Override
                              public void onCompleted(
                                      GestureDescription description) {

                                  MainActivity.postStatus(
                                          "Replay completed."
                                  );
                              }


                              @Override
                              public void onCancelled(
                                      GestureDescription description) {

                                  MainActivity.postStatus(
                                          "Replay cancelled."
                                  );
                              }
                          },

                          null
                  );
              }


              @Override
              public void onAccessibilityEvent(
                      android.view.accessibility.AccessibilityEvent event) {

                  // Not required.
              }


              @Override
              public void onInterrupt() {

                  // Not required.
              }


              @Override
              public void onDestroy() {

                  if (controller != null
                          && touchCallback != null) {

                      controller.unregisterCallback(
                              touchCallback
                      );

                      touchCallback = null;
                  }


                  controller = null;


                  if (instance == this) {

                      instance = null;
                  }


                  super.onDestroy();
              }
          }
          EOF


          # ======================================================
          # MAIN ACTIVITY
          # ======================================================

          cat > GestureRecorder/app/src/main/java/com/gesture/recorder/MainActivity.java <<'EOF'
          package com.gesture.recorder;

          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          public class MainActivity
                  extends Activity {


              private static TextView status;


              @Override
              protected void onCreate(
                      Bundle savedInstanceState) {

                  super.onCreate(
                          savedInstanceState
                  );

                  buildUI();
              }


              private void buildUI() {

                  ScrollView scroll =
                          new ScrollView(this);


                  LinearLayout root =
                          new LinearLayout(this);


                  root.setOrientation(
                          LinearLayout.VERTICAL
                  );


                  root.setPadding(
                          40,
                          40,
                          40,
                          40
                  );


                  scroll.addView(root);


                  TextView title =
                          new TextView(this);


                  title.setText(
                          "Gesture Recorder"
                  );


                  title.setTextSize(30);


                  title.setGravity(
                          Gravity.CENTER
                  );


                  root.addView(title);


                  TextView help =
                          new TextView(this);


                  help.setText(
                          "\nAndroid 16 Gesture Recorder\n\n"
                          + "1. Enable Accessibility.\n"
                          + "2. Press RECORD.\n"
                          + "3. Perform your gesture.\n"
                          + "4. Press STOP.\n"
                          + "5. Press REPLAY.\n"
                  );


                  help.setTextSize(17);


                  root.addView(help);


                  Button accessibility =
                          makeButton(
                                  "OPEN ACCESSIBILITY SETTINGS"
                          );


                  accessibility.setOnClickListener(
                          v -> {

                              startActivity(
                                      new Intent(
                                              Settings
                                                      .ACTION_ACCESSIBILITY_SETTINGS
                                      )
                              );
                          }
                  );


                  root.addView(accessibility);


                  Button record =
                          makeButton(
                                  "RECORD"
                          );


                  record.setOnClickListener(
                          v -> {

                              if (!serviceEnabled()) {

                                  postStatus(
                                          "Enable Gesture Recorder in Accessibility Settings first."
                                  );

                                  return;
                              }


                              GestureRecorder.start();


                              postStatus(
                                      "Recording..."
                              );
                          }
                  );


                  root.addView(record);


                  Button stop =
                          makeButton(
                                  "STOP"
                          );


                  stop.setOnClickListener(
                          v -> {

                              GestureRecorder.stop();


                              postStatus(
                                      "Stopped. "
                                      + GestureRecorder.size()
                                      + " points recorded."
                              );
                          }
                  );


                  root.addView(stop);


                  Button replay =
                          makeButton(
                                  "REPLAY"
                          );


                  replay.setOnClickListener(
                          v -> {

                              GestureAccessibilityService
                                      service =
                                      GestureAccessibilityService
                                              .getInstance();


                              if (service == null) {

                                  postStatus(
                                          "Accessibility service is not running."
                                  );

                                  return;
                              }


                              if (GestureRecorder.size()
                                      == 0) {

                                  postStatus(
                                          "Nothing recorded."
                                  );

                                  return;
                              }


                              GestureRecorder.stop();


                              postStatus(
                                      "Replaying..."
                              );


                              service.replay();
                          }
                  );


                  root.addView(replay);


                  Button clear =
                          makeButton(
                                  "CLEAR RECORDING"
                          );


                  clear.setOnClickListener(
                          v -> {

                              GestureRecorder.clear();


                              postStatus(
                                      "Recording cleared."
                              );
                          }
                  );


                  root.addView(clear);


                  status =
                          new TextView(this);


                  status.setText(
                          "\nStatus: Ready"
                  );


                  status.setTextSize(18);


                  status.setPadding(
                          0,
                          35,
                          0,
                          20
                  );


                  root.addView(status);


                  setContentView(scroll);
              }


              private Button makeButton(
                      String text) {

                  Button button =
                          new Button(this);


                  button.setText(text);


                  button.setTextSize(17);


                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(
                                  -1,
                                  -2
                          );


                  params.setMargins(
                          0,
                          12,
                          0,
                          0
                  );


                  button.setLayoutParams(params);


                  return button;
              }


              private boolean serviceEnabled() {

                  String enabled =
                          Settings.Secure.getString(
                                  getContentResolver(),
                                  Settings.Secure
                                          .ENABLED_ACCESSIBILITY_SERVICES
                          );


                  if (enabled == null) {

                      return false;
                  }


                  ComponentName component =
                          new ComponentName(
                                  this,
                                  GestureAccessibilityService.class
                          );


                  return enabled.contains(
                          component.flattenToString()
                  );
              }


              private static void
              setStatus(String message) {

                  if (status != null) {

                      status.setText(
                              "\nStatus: " + message
                      );
                  }
              }


              public static void
              postStatus(String message) {

                  if (status != null) {

                      status.post(
                              () -> status.setText(
                                      "\nStatus: " + message
                              )
                      );
                  }
              }
          }
          EOF


      # ==========================================================
      # GENERATE GRADLE WRAPPER
      # ==========================================================

      - name: Generate Gradle wrapper
        working-directory: GestureRecorder
        shell: bash
        run: |
          set -e
          gradle wrapper --gradle-version 8.10.2


      # ==========================================================
      # VERIFY SOURCES
      # ==========================================================

      - name: Verify project
        working-directory: GestureRecorder
        shell: bash
        run: |

          set -e

          echo "Java source files:"

          find app/src/main/java \
            -name "*.java" \
            -print

          echo

          echo "Gradle version:"

          ./gradlew --version


      # ==========================================================
      # BUILD APK
      # ==========================================================

      - name: Build debug APK
        working-directory: GestureRecorder
        shell: bash
        run: |

          set -e

          ./gradlew clean \
              :app:assembleDebug \
              --no-daemon \
              --stacktrace


      # ==========================================================
      # VERIFY APK
      # ==========================================================

      - name: Verify APK
        working-directory: GestureRecorder
        shell: bash
        run: |

          set -e

          test -f \
              app/build/outputs/apk/debug/app-debug.apk

          echo

          echo "===================================="

          echo "APK BUILD SUCCESSFUL"

          echo "===================================="

          ls -lh \
              app/build/outputs/apk/debug/app-debug.apk


      # ==========================================================
      # RENAME APK
      # ==========================================================

      - name: Rename APK
        working-directory: GestureRecorder
        shell: bash
        run: |

          cp \
              app/build/outputs/apk/debug/app-debug.apk \
              app/build/outputs/apk/debug/Gesture-Recorder-Android16.apk


      # ==========================================================
      # UPLOAD APK
      # ==========================================================

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gesture-Recorder-Android16
          path: GestureRecorder/app/build/outputs/apk/debug/Gesture-Recorder-Android16.apk
          if-no-files-found: error
          retention-days: 14
